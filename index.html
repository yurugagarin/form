<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORM · Antrenman &amp; Beslenme Takibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Karla',system-ui,-apple-system,sans-serif;color:#3a342c;
  background:radial-gradient(140% 90% at 50% 0%,#f1eadd 0%,#ece4d6 55%,#e4dac8 100%);min-height:100vh}
/* ============================================================
   TASARIM KATMANI — yüzey hiyerarşisi, alan renkleri, hareket
   ============================================================ */
:root{
  /* üç katman: sayfa → grup → kart */
  --pg:#e9e0d0;
  --card:#fffdf9;          /* kartlar sayfadan belirgin ayrılsın */
  --card2:#f9f4ea;         /* kart içi ikincil yüzey */
  --inset:#ffffff;         /* girdi alanı — içe gömük */
  --line:#ece1cd;
  --line2:#f3ecdd;
  --ink:#3a342c;
  --ink2:#8a7f6f;
  --ink3:#a8987c;
  --ink4:#c0b193;

  /* alan kimlikleri — kart başına TEK renk */
  --nut:#e0a272;    --nut-t:#faefe5;   /* beslenme  */
  --bod:#7c9ec4;    --bod-t:#e8eff6;   /* ölçüm     */
  --trn:#7fa88b;    --trn-t:#eaf1ec;   /* antrenman */
  --rec:#9b8fc0;    --rec-t:#efedf7;   /* toparlanma*/
  --wrn:#d9a03c;    --wrn-t:#faf0dc;   /* uyarı     */

  /* tipografi basamağı */
  --t-hero:34px; --t-big:21px; --t-mid:17px; --t-body:13px; --t-cap:11px;

  --ease:cubic-bezier(.32,.72,0,1);   /* iOS sheet eğrisi */
  --dur:.26s;
  --lift:0 1px 2px rgba(60,52,44,.05),0 6px 18px -8px rgba(60,52,44,.16);
  --lift2:0 2px 4px rgba(60,52,44,.06),0 14px 32px -12px rgba(60,52,44,.22);
}
body{background:radial-gradient(150% 95% at 50% 0%,#f0e8da 0%,#e9e0d0 52%,#ded2bd 100%)}
/* sayılar oynamasın */
.v,.gv,.gnum,.mstats .v,.kpi .v,.gstats .v,.musv,.mrv,.mrdelta,.dtv,.gratv,
input[inputmode="decimal"],input[inputmode="numeric"],.gkg,.grep{font-variant-numeric:tabular-nums}

/* ---- yüzeyler ---- */
.card{background:var(--card);box-shadow:var(--lift);
  border:1px solid rgba(255,255,255,.7);position:relative}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);pointer-events:none}
.metrics > div{background:var(--card)}
.metrics{background:var(--line)}

/* ---- alan kimliği: üstte 3px şerit + tonlu başlık ---- */
.card.dom{border-top:3px solid var(--dc,var(--ink3))}
.card.dom > .hd{background:var(--dt,transparent)}
.card.dom > .hd h2{color:var(--dh,var(--ink))}
.dom-nut{--dc:var(--nut);--dt:var(--nut-t);--dh:#9c5f27}
.dom-bod{--dc:var(--bod);--dt:var(--bod-t);--dh:#3d648c}
.dom-trn{--dc:var(--trn);--dt:var(--trn-t);--dh:#41694f}
.dom-rec{--dc:var(--rec);--dt:var(--rec-t);--dh:#5b4f86}
.dom-wrn{--dc:var(--wrn);--dt:var(--wrn-t);--dh:#8d6413}

/* mobil kartlar */
.scard{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.scard.dom{border-left:3px solid var(--dc,var(--ink3))}
.scard.dom .stitle{color:var(--dh,var(--ink))}
.scard.dom::after{content:'';position:absolute;inset:0 0 auto 0;height:44px;
  background:linear-gradient(var(--dt,transparent),transparent);pointer-events:none;z-index:0}
.scard{position:relative}
.scard > *{position:relative;z-index:1}

/* ---- girdi alanları içe gömük ---- */
.inp,.ginp,.gset input,.grep,.note,.rirsel{
  background:var(--inset);
  box-shadow:inset 0 1px 2px rgba(60,52,44,.07);
  transition:box-shadow .18s ease,border-color .18s ease,background .18s ease}
.inp:focus,.ginp:focus,.gset input:focus,.grep:focus,.note:focus{
  box-shadow:inset 0 1px 2px rgba(60,52,44,.04),0 0 0 3px rgba(227,162,63,.2)}
/* dolu alan solunda renkli çizgi */
.gfield{position:relative}
.gfield.on::before,.metrics > div.on::before{content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;border-radius:2px;background:var(--fc,var(--trn));opacity:.85}
.metrics > div{position:relative}
.gfield.on::before{left:-2px;top:22px;bottom:auto;height:52px}

/* ---- tipografi ---- */
.card > .hd h2{font-size:var(--t-mid);letter-spacing:-.15px}
.kpi .v,.mstats .v{letter-spacing:-.4px}

/* ---- hareket ---- */
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popNum{0%{transform:scale(1)}38%{transform:scale(1.11)}100%{transform:scale(1)}}
@keyframes fillBar{from{width:0}}
.card,.scard{animation:riseIn .34s var(--ease) both}
.card:nth-of-type(2),.scard:nth-of-type(2){animation-delay:.04s}
.card:nth-of-type(3),.scard:nth-of-type(3){animation-delay:.08s}
.card:nth-of-type(4),.scard:nth-of-type(4){animation-delay:.12s}
.card:nth-of-type(5),.scard:nth-of-type(5){animation-delay:.16s}
.card:nth-of-type(n+6),.scard:nth-of-type(n+6){animation-delay:.2s}
.mbar i,.gbar i,.mustrack i,.mrtrack i{animation:fillBar .55s var(--ease) both;transition:width .4s var(--ease)}
.pulse{animation:popNum .42s var(--ease)}
/* bölüm aç/kapa */
.msbody{animation:sheetIn var(--dur) var(--ease) both;overflow:hidden}
@keyframes sheetIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.msarrow{transition:transform var(--dur) var(--ease)}
.msect.on .msarrow{transform:rotate(90deg)}
/* sekme geçişi */
#g-body{animation:tabIn .3s var(--ease) both}
@keyframes tabIn{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
.card,.scard,.mbtn,.ghostbtn,.gchip,.phtab,.dnav button{transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s var(--ease),box-shadow .22s ease}
.card:hover{box-shadow:var(--lift2)}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

input,button,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-thumb{background:#cdbfa8;border-radius:8px;border:2px solid #fbf8f2}
::-webkit-scrollbar-track{background:#f1e8d7}
.wrap{max-width:1440px;margin:0 auto;padding:26px 30px 56px}
@media(max-width:900px){.wrap{padding:16px 12px 44px}}

/* --- ortak --- */
.card{background:#fbf8f2;border-radius:14px;box-shadow:0 1px 3px rgba(60,52,44,.08);overflow:hidden;margin-bottom:15px}
.card > .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:14px 18px;border-bottom:1px solid #ece1cd}
.card > .hd h2{font-family:'Fraunces';font-size:19px;font-weight:600}
.card > .hd .meta{font-size:12.5px;color:#a8987c;font-weight:600}
.pad{padding:18px}
.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#a8987c;font-weight:700}
.serif{font-family:'Fraunces';font-weight:600}
.ghostbtn{background:#fbf8f2;border:1px solid #d9ccb5;border-radius:9px;padding:8px 13px;font-size:13px;
  font-weight:600;color:#6b5f4d;cursor:pointer;transition:background .12s}
.ghostbtn:hover{background:#f3ecdd}
.ghostbtn.dark{background:#3a342c;border-color:#3a342c;color:#f3ecdf}
.ghostbtn:focus-visible{outline:2px solid #e3a23f;outline-offset:2px}
.inp{border:1px solid #ddd0b8;border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;outline:none;width:100%}
.inp:focus{border-color:#e3a23f;box-shadow:0 0 0 3px rgba(227,162,63,.16)}
.inp.r{text-align:right;font-weight:600}

/* --- KPI --- */
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:15px}
.kpi > div{background:#fbf8f2;border-radius:14px;padding:15px 17px;box-shadow:0 1px 3px rgba(60,52,44,.08)}
.kpi .v{font-family:'Fraunces';font-size:25px;font-weight:600;margin-top:4px;line-height:1.1}
.kpi .s{font-size:12px;color:#b3a488;font-weight:600;margin-top:2px}
@media(max-width:1100px){.kpi{grid-template-columns:repeat(3,1fr)}}
@media(max-width:680px){.kpi{grid-template-columns:repeat(2,1fr)}}

.charts{display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:start;margin-bottom:15px}
.charts > .card{margin-bottom:0}
@media(max-width:1000px){.charts{grid-template-columns:1fr}.charts > .card{margin-bottom:13px}}

/* --- gün gezinme --- */
.daynav{display:flex;align-items:center;gap:10px}
.daynav button{width:34px;height:34px;border-radius:9px;border:1px solid #d9ccb5;background:#fbf8f2;
  font-size:16px;cursor:pointer;color:#6b5f4d;line-height:1}
.daynav button:disabled{opacity:.35;cursor:default}

/* --- ölçüm / beslenme satırı --- */
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:#ece1cd}
.metrics > div{background:#fbf8f2;padding:13px 14px}
.metrics label{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#a8987c;font-weight:700;margin-bottom:6px}
.metrics .u{font-size:11px;color:#c0b193;font-weight:600;margin-left:3px}
.advg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.advr{min-width:0}
.advt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12.5px;font-weight:700}
.advt span{color:#6b5f4d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.advt b{font-family:'Fraunces';font-size:14px;font-weight:600;white-space:nowrap}
.advr .mbar{height:6px;margin-top:5px}
.advs{font-size:10.5px;font-weight:600;color:#b3a488;margin-top:3px}
.mbar{height:4px;background:#efe7d6;border-radius:3px;margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.mhint{font-size:11.5px;font-weight:600;margin-top:5px;color:#a8987c}
@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.metrics{grid-template-columns:repeat(2,1fr)}}

/* --- antrenman --- */
.exrow{border-bottom:1px solid #f0e8d8;padding:13px 18px}
.exrow:last-of-type{border-bottom:none}
.exhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.exname{font-weight:700;font-size:14.5px;flex:1;min-width:150px}
.extgt{font-size:11.5px;color:#a8987c;font-weight:700;background:#f3ecdd;border-radius:6px;padding:2px 8px;white-space:nowrap}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 9px;white-space:nowrap;letter-spacing:.3px}
.sets{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.setbox{display:flex;align-items:center;gap:4px;background:#f7f1e4;border:1px solid #e8dcc4;border-radius:9px;padding:4px 6px}
.setbox .n{font-size:10px;font-weight:700;color:#bdac8e;width:11px;text-align:center}
.setbox input{width:46px;border:none;background:#fff;border-radius:6px;padding:6px 5px;text-align:center;
  font-size:13.5px;font-weight:700;outline:none;border:1px solid #e8dcc4}
.setbox input:focus{border-color:#e3a23f;background:#fff9ec}
.setbox .x{font-size:11px;color:#bdac8e;font-weight:700}
.setbox button{background:none;border:none;color:#cdbb9c;font-size:14px;cursor:pointer;padding:0 2px;line-height:1}
.setbox .wipe{color:#e4dac6;font-size:11px}
.setbox.filled .wipe{color:#bdac8e}
.setbox .wipe:hover{color:#ef5a1e}
.addset{background:#fff;border:1px dashed #d9ccb5;border-radius:9px;color:#a8987c;font-size:12px;
  font-weight:700;padding:0 12px;cursor:pointer}
.exft{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:#a8987c;font-weight:600}
.exft b{font-weight:700}

/* --- haftalık tablo --- */
.tbl{overflow-x:auto}
.tbl .g{display:grid;min-width:880px}
.tbl .c{padding:8px 10px;border-bottom:1px solid #f0e8d8;font-size:12.5px;display:flex;align-items:center;justify-content:flex-end;min-width:0}
.tbl .c.l{justify-content:flex-start;font-weight:600;position:sticky;left:0;background:#fbf8f2;z-index:2}
.tbl .h{background:#f3ecdd;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#a8987c;
  font-weight:700;border-bottom:1px solid #e4d9c2;padding:9px 10px;display:flex;align-items:center;justify-content:flex-end}
.tbl .h.l{justify-content:flex-start;position:sticky;left:0;z-index:3;background:#f3ecdd}
.tbl .h.today{color:#b5552e;background:rgba(227,162,63,.18)}
.tbl .c.today{background:rgba(227,162,63,.07)}
.tbl .c.avg,.tbl .h.avg{background:#efe7d6;font-weight:700}
.tbl .sec{grid-column:1/-1;background:#f3ecdd;padding:7px 12px;font-family:'Fraunces';font-size:12.5px;
  font-weight:600;border-bottom:1px solid #e4d9c2;letter-spacing:.3px}

/* --- takvim --- */
.calwrap{overflow-x:auto}
.cal{min-width:430px}
.calhd{display:grid;grid-template-columns:64px repeat(7,1fr) 62px;gap:4px;margin-bottom:6px}
.calhd span{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#a8987c;font-weight:700;text-align:center}
.calhd span:first-child{text-align:left}
.calrow{display:grid;grid-template-columns:64px repeat(7,1fr) 62px;gap:4px;margin-bottom:4px;align-items:center}
.calrow .wk{font-size:11px;font-weight:700;color:#a8987c}
.calrow .wk.now{color:#b5552e}
.calrow .kg{font-size:11px;font-weight:700;color:#8a7f6f;text-align:right;font-variant-numeric:tabular-nums}
.cell{aspect-ratio:1/1;border-radius:6px;background:#efe7d6;border:1px solid transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.9);
  transition:transform .1s}
.cell:hover{transform:scale(1.12)}
.cell.sel{border-color:#3a342c;box-shadow:0 0 0 2px rgba(58,52,44,.2)}
.cell.future{background:#f5efe2;cursor:default;opacity:.65}
.cell.today{border-color:#e3a23f;box-shadow:0 0 0 2px rgba(227,162,63,.35)}
.legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:#a8987c;font-weight:600;margin-top:12px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}

.note{width:100%;border:1px solid #ddd0b8;border-radius:9px;padding:10px 12px;font-size:13.5px;
  background:#fff;outline:none;resize:vertical;min-height:64px}
.note:focus{border-color:#e3a23f}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#3a342c;color:#f3ecdf;
  padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:99}
.toast.on{opacity:1}
.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:800px){.settings{grid-template-columns:repeat(2,1fr)}}
.settings label{display:block;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#a8987c;font-weight:700;margin-bottom:6px}
/* --- hareket görseli --- */
.thumb{width:62px;height:52px;flex:none;border-radius:9px;background:#f7f1e4;border:1px solid #e8dcc4;
  cursor:zoom-in;padding:2px;transition:transform .12s,border-color .12s}
.thumb:hover{transform:scale(1.06);border-color:#e3a23f}
.thumb:focus-visible{outline:2px solid #e3a23f;outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(58,52,44,.62);display:none;align-items:center;justify-content:center;
  z-index:200;padding:20px}
.modal.on{display:flex}
.mbox{background:#fbf8f2;border-radius:16px;max-width:520px;width:100%;box-shadow:0 18px 50px rgba(45,38,28,.3);position:relative;overflow:hidden}
.mbox .fg{background:#f3ecdd;padding:14px;height:300px}
.mbox .fg svg{width:100%;height:100%}
.mbox .bd{padding:16px 20px 20px}
.mbox h3{font-family:'Fraunces';font-size:21px;font-weight:600;margin-bottom:3px}
.mbox .sub{font-size:13px;color:#a8987c;font-weight:600}
.mx{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid #ddd0b8;
  background:#fbf8f2;font-size:18px;cursor:pointer;color:#6b5f4d;line-height:1;z-index:2}
.mlink{display:inline-block;margin-top:12px;background:#3a342c;color:#f3ecdf;border-radius:9px;
  padding:9px 15px;font-size:13px;font-weight:700;text-decoration:none}

/* --- program sekmeleri --- */
.ptabs{display:flex;gap:7px;flex-wrap:wrap;padding:14px 18px 0}
.ptab{border:1px solid #ddd0b8;background:#fbf8f2;border-radius:9px;padding:8px 13px;font-size:13px;
  font-weight:700;color:#8a7f6f;cursor:pointer}
.ptab.on{background:#3a342c;border-color:#3a342c;color:#f3ecdf}
.plist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 18px 18px}
@media(max-width:700px){.plist{grid-template-columns:1fr}}
.pitem{display:flex;gap:11px;align-items:center;background:#f7f1e4;border:1px solid #ece1cd;border-radius:11px;padding:9px}
.pitem .n{font-weight:700;font-size:13.5px;line-height:1.3}
.pitem .t{font-size:11.5px;color:#a8987c;font-weight:700;margin-top:2px}
.thumb svg{pointer-events:none}
.exdesc{font-size:12px;color:#8a7f6f;line-height:1.4;margin-top:2px}
.pitem .d{font-size:11.5px;color:#8a7f6f;line-height:1.4;margin-top:3px}

/* --- kompakt takvim: satır = haftanın günü, sütun = hafta --- */
.calg{display:grid;gap:3px;min-width:560px}
.calg .hl{font-size:10px;color:#a8987c;font-weight:700;text-align:center;letter-spacing:.2px}
.calg .hl.now{color:#b5552e}
.calg .dl{font-size:11px;color:#a8987c;font-weight:700;display:flex;align-items:center}
.calg .cell{width:100%;aspect-ratio:1/1;border-radius:3.5px;background:#efe7d6;border:1px solid transparent;
  cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;letter-spacing:-.2px;overflow:hidden}
.calg .cell:hover{transform:scale(1.35);z-index:2;position:relative}
.calg .cell.paint{cursor:cell}
.calg .cell.future{opacity:.75;cursor:pointer}
.calg .cell.rest{background:#cfc0a4}

.calg .cell.sel{border-color:#3a342c}
.calg .cell.today{border-color:#e3a23f;box-shadow:0 0 0 1.5px rgba(227,162,63,.5)}

/* --- dinlenme günü seçici --- */
.sups{display:flex;gap:8px;flex-wrap:wrap}
.sups button{display:flex;align-items:center;gap:7px;border:1px solid #ddd0b8;background:#fbf8f2;border-radius:9px;
  padding:9px 13px;font-size:13px;font-weight:700;color:#a8987c;cursor:pointer;transition:background .12s}
.sups button:hover{background:#f3ecdd}
.sups button .tick{font-size:14px;line-height:1}
.sups button .dose{font-size:11px;font-weight:600;color:#c0b193}
.sups button.on .dose{opacity:.75;color:inherit}
.rest7{display:flex;gap:6px;flex-wrap:wrap}
.rest7 button{flex:1;min-width:44px;border:1px solid #ddd0b8;background:#fbf8f2;border-radius:8px;
  padding:9px 4px;font-size:12.5px;font-weight:700;color:#8a7f6f;cursor:pointer}
.rest7 button.on{background:#e0d4bc;border-color:#c4b69b;color:#6b5f4d}
.rest7 button.on::after{content:' ·zzz';font-size:9px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#ece1cd}
.duo > div{background:#fbf8f2;padding:11px 14px 8px}
@media(max-width:700px){.duo{grid-template-columns:1fr}}
.big{font-family:'Fraunces';font-size:20px;font-weight:600;line-height:1}
.chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
/* ================= SALON MODU ================= */

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
function today(){return iso(new Date());}
function dayDiff(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function monday(s){var d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);}
function fdate(s){var d=pd(s);return d.getDate()+' '+AY[d.getMonth()];}
function flong(s){var d=pd(s);return d.getDate()+' '+AY[d.getMonth()]+' '+d.getFullYear();}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function n(v){if(v===''||v==null)return null;var x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null;}
function fx(v,d){return v==null?'—':(+v).toFixed(d==null?1:d);}
function ti(v){return v==null?'—':Math.round(v).toLocaleString('tr-TR');}
function clamp(x){return Math.max(0,Math.min(100,x));}

    var d=addD(m0,k);
    if(d<S.startDate)continue;
    if(S.plan[d]==='trav'||dtOf(d)==='trav')continue;
    if(restOf(d).indexOf(pd(d).getDay())>=0)S.plan[d]='rest';
    else{S.plan[d]=ORDER[i%5];i++;}
  }
  S._pt=Date.now();save();
}
/* sıradaki antrenman: son kaydedilen program gününden bir sonraki */
function suggestDt(d){
  var seen={};
  Object.keys(S.days).forEach(function(x){if(S.days[x].dt)seen[x]=S.days[x].dt;});
  Object.keys(S.plan||{}).forEach(function(x){if(!seen[x])seen[x]=S.plan[x];});
  var ks=Object.keys(seen).filter(function(x){return x<d&&ORDER.indexOf(seen[x])>=0;}).sort();
  if(!ks.length)return 'gun1';
  return ORDER[(ORDER.indexOf(seen[ks[ks.length-1]])+1)%ORDER.length];
}
function restOf(d){var r=S.restWeeks&&S.restWeeks[monday(d)];return (r&&r.length!=null)?r:S.restDays;}
function isRest(d){var e=dtOf(d)||planned(d);if(e)return e==='rest';return restOf(d).indexOf(pd(d).getDay())>=0;}
/* o gün, kendi haftasında (Pzt–Paz) kaçıncı antrenman? */
function weekOrd(d){
  var m=monday(d),n=0;
  for(var i=0;i<7;i++){
    var x=addD(m,i),dt=(S.days[x]&&S.days[x].dt)||(S.plan&&S.plan[x])||null;
    if(!dt&&restOf(x).indexOf(pd(x).getDay())>=0)dt='rest';
    if(dt&&PROGRAM[dt]&&PROGRAM[dt].ex.length){n++;if(x===d)return n;}
  }
  return 0;
}
/* başlıkta gösterilecek ad: haftadaki sıra + antrenman adı */
function dayTitle(d){
  var k=planOf(d),t=PROGRAM[k];
  if(!t)return 'planlanmadı';
  if(!t.ex.length)return t.name;
  var o=weekOrd(d);
  return (o?'Gün '+o+' · ':'')+t.name;
}
function planOf(d){return dtOf(d)||planned(d)||(isRest(d)?'rest':suggestDt(d));}
/* o günün adı: "Gün 4" program türüdür; kullanıcı için asıl anlamlı olan
   takvimde o haftanın kaçıncı antrenman günü olduğudur */
function typeName(k){
  var L=PROGRAM[k]&&PROGRAM[k].label;if(!L)return '';
  var parts=L.split(' · ');
  return (parts[1]||parts[0]).replace(/ ⭐.*/,'').replace(/\(.*/,'').trim();
}
function weekOrder(d){
  var m=monday(d),n=0;
  for(var i=0;i<7;i++){
    var dd=addD(m,i),dt=(dd===d)?planOf(dd):effDt(dd);
    var isT=ORDER.indexOf(dt)>=0;
    if(isT)n++;
    if(dd===d)return isT?n:null;
  }
  return null;
}
function weekPlanCount(d){
  var m=monday(d),n=0;
  for(var i=0;i<7;i++){var dd=addD(m,i);if(ORDER.indexOf((dd===d)?planOf(dd):effDt(dd))>=0)n++;}
  return n;
}
function dayTitle(d){
  var dt=planOf(d);
  if(ORDER.indexOf(dt)<0)return PROGRAM[dt]?PROGRAM[dt].label.split(' (')[0]:'planlanmadı';
  var o=weekOrder(d);
  return (o?o+'. Gün · ':'')+typeName(dt);
}
function dayTitleShort(d){
  var dt=planOf(d);
  if(ORDER.indexOf(dt)<0)return PROGRAM[dt]?PROGRAM[dt].short:'';
  var o=weekOrder(d);
  return (o?o+'. GÜN · ':'')+typeName(dt).toUpperCase();
}

/* eski hareket adlarını yeni adlara taşı — girilmiş veriler kaybolmaz */
/* Aynı hareketin günden güne farklı yazılması geçmişi böler: uygulama
   "Eğik press" ile "Eğik dambıl press"i iki ayrı hareket sanıp önceki seansı

   birleştirildi; eski kayıtlar da buradan yeni ada taşınıyor. */
var RENAMES={'Düz bench press':'Düz dambıl press','Göğüs destekli row':'Makine row',
  'Geniş tutuş lat pulldown':'Lat pulldown / Barfiks',
  'Eğik press':'Eğik dambıl press',
  'Yan kaldırış':'Oturarak dambıl yan kaldırış',
  'Triceps pushdown':'Halat pushdown',
  'Tek kol dambıl row':'Makine row'};
function migrateNames(){

    Object.keys(RENAMES).forEach(function(old){

/* ============ HESAP ============ */
/* set ağırlığı: hepsi yapıldı ve tekrarlar aralıktaysa tam,
   setler tam ama tekrar biraz eksikse neredeyse tam sayılır */
var EXW={tam:1,yakin:0.85,kismi:0.5,dusuk:0.3,bos:0};
/* Deload haftasında hedef set sayısı yarıya iner, ağırlık aynı kalır. */
function tgtOn(e,d){
  if(!e)return e;
  var dd=d||cur;
  if(!isDeload(dd))return e;
  return {n:e.n,s:Math.max(1,Math.round(e.s/2)),r:e.r,dl:true,off:e.off};
}
/* ---- bir hareketin O GÜNKÜ hedefi ----
   Aynı hareket farklı günlerde farklı hedefle geçebilir:
   Eğik dambıl press → İtiş'te 3×6-10, Üst'te 3×8-12.
   EXTGT hareketin İLK geçtiği günü verir; bu yüzden hedef ORADAN okunursa
   yanlış gün için konuşmuş oluruz. progression() tam bunu yapıyordu:
   Üst gününde 36×11 girince "10 tekrara ulaştın, 38 kg'a çık, 6-10'a dön"
   diyordu — oysa o gün hedef 8-12'ydi ve 11 tekrar üst sınır değildi.
   Artık hedef, hareketin gerçekten yapıldığı günden okunuyor. */
function tgtFor(name,d){
  var e=null,dt=d?dtOf(d):null,t=dt?PROGRAM[dt]:null;
  if(t)t.ex.forEach(function(x){if(x.n===name)e=x;});
  if(!e)e=EXTGT[name];
  if(!e)return null;
  return d?tgtOn(e,d):e;
}
/* hareketin programdaki bütün hedefleri (birden fazla günde geçiyorsa hepsi) */
function tgtLabel(name){
  var seen=[],out=[];
  ORDER.forEach(function(k){PROGRAM[k].ex.forEach(function(x){
    if(x.n!==name)return;
    var lb=x.s+' × '+x.r[0]+'-'+x.r[1];
    if(seen.indexOf(lb)<0){seen.push(lb);out.push([lb,PROGRAM[k].short]);}
  });});
  if(!out.length)return '';
  if(out.length===1)return out[0][0];
  return out.map(function(z){return z[0]+' ('+z[1]+')';}).join(' · ');
}
/* ---- o günün DEĞERLENDİRİLECEK hareket listesi ----
   Programdan bir hareket çıkarılınca geçmiş kayıtlar silinmiyor. Ama
   değerlendirme fonksiyonları sadece PROGRAM[gun].ex üzerinde dönüyordu;
   yani çıkarılan hareketin geçmişteki setleri hacimden, hacim trendinden ve
   seans karşılaştırmasından bir anda buhar oluyordu — 26 Ağu seansı geriye
   dönük küçülüyordu.
   dayEx() = o günün güncel plan hareketleri + o gün gerçekten girilmiş ama
   artık planda olmayan hareketler (off:true).
   Kural: plan dışı hareketler HACME ve kas seti sayacına girer (yapıldılar),
   kalite yüzdesine girmez (plan onlar değil). Böylece geçmiş bozulmaz,
   bugünün puanı da şişmez. */
function dayEx(d,dt){
  var t=dt?PROGRAM[dt]:null;if(!t)return [];
  var list=t.ex.slice(),seen={};
  list.forEach(function(x){seen[x.n]=1;});
  var ex=(D(d)||{}).ex||{};
  Object.keys(ex).forEach(function(nm){
    if(seen[nm])return;
    var f=(ex[nm]||[]).filter(function(z){return z.kg!=null&&z.rep!=null;});
    if(!f.length)return;
    var b=EXTGT[nm];
    list.push({n:nm,s:(b?b.s:f.length),r:(b?b.r:[1,99]),off:true});
  });
  return list;
}
/* ---- seyahat / izin günü ----
   Gün bazında işaretlenir, hafta bazında değil: seyahat bazen 2 gün, bazen 5 gün.
   İşaretli günde hiçbir antrenman beklenmez — takvim, set sayacı ve gün puanı
   o günü eksik saymaz. Beslenme ve kilo yine girilebilir. */
function isTrav(d){return effDt(d||cur)==='trav';}
function travDays(){return keys().concat(Object.keys(S.plan||{}))
  .filter(function(d,i,a){return a.indexOf(d)===i&&effDt(d)==='trav';}).sort();}
/* Bir set "etkili" sayılır:
   - tekrar hedef aralığın içindeyse, VEYA
   - ağırlık geçen seansa göre arttıysa ve tahmini 1RM,
     eski ağırlıkla aralığın alt sınırında yapılan setin karşılığını geçiyorsa.
   Ağırlık artırıp tekrarın düşmesi ilerlemedir, eksiklik değil. */
function evalEx(sets,tgt,prev){
  var f=(sets||[]).filter(function(s){return s.kg!=null&&s.rep!=null;});
  if(!f.length)return{state:'bos',vol:0,done:0,perf:0,up:false,label:'girilmedi',color:'#c0b193',bg:'#f3ecdd'};
  var pmx=null;
  if(prev&&prev.sets&&prev.sets.length)
    pmx=Math.max.apply(null,prev.sets.map(function(s){return s.kg;}));
  var mx=Math.max.apply(null,f.map(function(s){return s.kg;}));
  var up=(pmx!=null&&mx>pmx);
  var bar=(pmx!=null)?e1rm(pmx,tgt.r[0]):null;   /* eski ağırlıkla alt sınır eşdeğeri */
  var vol=0,inRange=0;
  f.forEach(function(s){
    vol+=s.kg*s.rep;
    var ok=(s.rep>=tgt.r[0]);
    if(!ok&&up&&bar!=null&&e1rm(s.kg,s.rep)>=bar)ok=true;
    if(ok)inRange++;
  });
  var perf=f.length,need=tgt.s,st,label,color,bg;
  var below=f.filter(function(s){return s.rep<tgt.r[0];}).length;
  if(perf>=need&&inRange>=need){
    st='tam';
    label=up?(below?'ağırlık arttı · aralığa dön':'tamamlandı · ağırlık arttı')
            :(tgt.dl?'deload tamam':'tamamlandı');
    color=C.green;bg='rgba(22,168,90,.12)';}
  else if(perf>=need){st='yakin';label='setler tam · tekrar az';color='#5aa832';bg='rgba(90,168,50,.14)';}
  else if(perf>0){st='kismi';label=perf+'/'+need+' set';color=C.amber;bg='rgba(244,173,21,.16)';}
  else{st='dusuk';label='eksik';color=C.orange;bg='rgba(239,90,30,.13)';}
  return{state:st,vol:vol,done:inRange,perf:perf,up:up,need:need,label:label,color:color,bg:bg};
}
var _pc={},_sc={};
function prevSession(name,before){
  var ck=name+'|'+before; if(ck in _pc)return _pc[ck];
  var ks=keys().filter(function(d){return d<before;}).reverse(),out=null;
  for(var i=0;i<ks.length;i++){
    var sets=(D(ks[i]).ex||{})[name];
    if(sets){var f=sets.filter(function(s){return s.kg!=null&&s.rep!=null;});
      if(f.length){var v=0;f.forEach(function(s){v+=s.kg*s.rep;});
        out={date:ks[i],vol:v,sets:f,txt:f.map(function(s){return s.kg+'×'+s.rep;}).join(' · ')};break;}}
  }
  _pc[ck]=out;return out;
}
function sessionEval(d,ov){
  if(ov)return _sessionEval(d,ov);
  if(d in _sc)return _sc[d];
  var r0=_sessionEval(d,dtOf(d));_sc[d]=r0;return r0;
}
function _sessionEval(d,dt){
  var t=dt?PROGRAM[dt]:null; if(!t||!t.ex.length)return null;
  var r=D(d),vol=0,tam=0,giren=0,prevVol=0,hasPrev=false,wsum=0,off=0;
  dayEx(d,dt).forEach(function(e){
    var p=prevSession(e.n,d);
    var ev=evalEx((r.ex||{})[e.n],tgtOn(e,d),p);
    vol+=ev.vol;                       /* hacim: plan dışı dahil — yapılan iş yapılmıştır */
    if(p){prevVol+=p.vol;hasPrev=true;}
    if(e.off){if(ev.state!=='bos')off++;return;}  /* kaliteye girmez */
    wsum+=(EXW[ev.state]||0);
    if(ev.state==='tam'||ev.state==='yakin')tam++;
    if(ev.state!=='bos')giren++;
  });
  if(!giren&&!off)return{empty:true,total:t.ex.length};
  if(!giren)return{empty:false,vol:vol,tam:0,q:0,total:t.ex.length,giren:0,off:off,
    verdict:'Plan dışı seans',vcolor:C.amber,trend:(hasPrev&&prevVol>0)?((vol-prevVol)/prevVol*100):null};
  var pct=wsum/t.ex.length*100;
  var v,vc;
  if(pct>=85){v='Güçlü seans';vc=C.green;}
  else if(pct>=60){v='İyi seans';vc='#5aa832';}
  else if(pct>=35){v='Eksik seans';vc=C.amber;}
  else{v='Zayıf seans';vc=C.orange;}
  return{empty:false,vol:vol,tam:tam,q:wsum/t.ex.length,total:t.ex.length,giren:giren,off:off,verdict:v,vcolor:vc,
    trend:(hasPrev&&prevVol>0)?((vol-prevVol)/prevVol*100):null};
}
/* gün puanı 0–100 → takvim ısısı */
function score(d){
  if(d>today())return null;
  var r=S.days[d]; if(!r)return 0;
  var T=S.targets,s=0;
  if(r.w!=null)s+=10;
  if(r.st!=null)s+=20*Math.min(1,r.st/T.steps);
  if(r.p!=null)s+=25*Math.min(1,r.p/T.protein);
  if(r.kcal!=null)s+=15*(r.kcal<=T.kcal*1.08?1:(r.kcal<=T.kcal*1.2?.5:0));
  var dt=effDt(d),t=dt?PROGRAM[dt]:null;
  if(!dt)s+=0;
  else if(!t||!t.ex.length)s+=30;
  else{var e=sessionEval(d);s+=30*(e&&!e.empty?e.tam/e.total:0);}
  return Math.round(s);
}
/* takvim rengi artık beslenmeye değil antrenman kalitesine bakıyor */
function dayQuality(d){
  if(d>today())return null;
  var dt=effDt(d);if(!dt)return 'none';
  var t=PROGRAM[dt];if(!t.ex.length)return 'rest';
  var e=sessionEval(d,dt);
  if(!e||e.empty)return 0;
  return e.q;
}
function qColor(q){
  if(q>=0.9)return '#16a85a';
  if(q>=0.7)return 'rgba(22,168,90,.55)';
  if(q>=0.4)return 'rgba(244,173,21,.75)';
  return 'rgba(239,90,30,.5)';
}
function heat(sc){
  if(sc==null)return null;
  if(sc===0)return '#efe7d6';
  if(sc<40)return 'rgba(239,90,30,.55)';
  if(sc<70)return 'rgba(244,173,21,.7)';

  return C.green;
}
function weightSeries(){return keys().filter(function(d){return D(d).w!=null;}).map(function(d){return{d:d,v:D(d).w};});}

/* ============ TREND KİLO (üssel hareketli ortalama) ============
   Tek bir tartı ölçümü su/glikojen yüzünden 1-3 kg sapabilir.
   Trend, ham veriden çok daha dürüst bir gösterge. */
function emaSeries(key,alpha){
  alpha=alpha||0.25;
  var raw=keys().filter(function(d){return D(d)[key]!=null;});
  if(!raw.length)return [];
  var out=[],e=null,first=raw[0],last=raw[raw.length-1],nD=dayDiff(first,last);
  for(var i=0;i<=nD;i++){
    var d=addD(first,i),v=D(d)[key];
    if(v!=null)e=(e==null)?v:(alpha*v+(1-alpha)*e);
    if(e!=null)out.push({d:d,v:e,raw:v});
  }
  return out;
}
function trendW(){return emaSeries('w');}
function trendNow(){var t=trendW();return t.length?t[t.length-1].v:null;}
/* trendin son N gündeki eğimi — kg/hafta */
function trendSlope(days){
  var t=trendW();if(t.length<4)return null;
  var end=t[t.length-1],from=addD(end.d,-(days||14));
  var w=t.filter(function(x){return x.d>=from;});
  if(w.length<4)return null;
  var n=w.length,sx=0,sy=0,sxy=0,sxx=0;
  w.forEach(function(p){var x=dayDiff(w[0].d,p.d);sx+=x;sy+=p.v;sxy+=x*p.v;sxx+=x*x;});
  var den=n*sxx-sx*sx;if(!den)return null;
  return ((n*sxy-sx*sy)/den)*7;
}

/* ============ GERÇEK BAKIM KALORİSİ (adaptive TDEE) ============
   TDEE = ortalama alım − (haftalık kilo değişimi × 7700 ÷ 7)
   Sabit hedef zamanla yanlışlaşır; bu kendi verinden geri hesaplar. */
var KCAL_PER_KG=7700;
function tdee(win){
  win=win||21;
  var t=trendW();if(t.length<8)return {ok:false,why:'kilo',n:t.length};
  var end=t[t.length-1].d,from=addD(end,-(win-1));
  var span=t.filter(function(x){return x.d>=from;});
  if(span.length<8)return {ok:false,why:'kilo',n:span.length};
  var kd=[];
  for(var i=0;i<=dayDiff(span[0].d,end);i++){
    var d=addD(span[0].d,i),v=D(d).kcal;if(v!=null)kd.push(v);
  }
  var nDays=dayDiff(span[0].d,end)+1,cov=kd.length/nDays;
  if(kd.length<7)return {ok:false,why:'kalori',n:kd.length};
  var avg=kd.reduce(function(a,b){return a+b;},0)/kd.length;
  var slope=trendSlope(Math.min(win,nDays));
  if(slope==null)return {ok:false,why:'kilo',n:span.length};
  var val=avg-(slope*KCAL_PER_KG/7);
  var conf=(kd.length>=17&&cov>=.8)?'yüksek':((kd.length>=11&&cov>=.6)?'orta':'düşük');
  return {ok:true,tdee:Math.round(val),avg:Math.round(avg),kgWeek:slope,
    days:nDays,logged:kd.length,cov:cov,conf:conf,
    deficit:Math.round(val-avg)};
}
/* hedef kayıp hızı: haftada 0.5-0.7 kg */
var RATE_LO=-0.7,RATE_HI=-0.3,RATE_TGT=-0.55;
function tdeeAdvice(){
  var t=tdee();if(!t.ok)return null;
  var sug=Math.round((t.tdee+RATE_TGT*KCAL_PER_KG/7)/10)*10;
  var d=Math.round(sug-S.targets.kcal);
  if(t.kgWeek>RATE_HI)
    return {t:t,type:'slow',sug:sug,delta:d,
      msg:'Haftalık kayıp '+fx(Math.abs(t.kgWeek),2)+' kg — hedef aralığın altında. Kaloriyi <b>'+ti(sug)+'</b>’a çek ya da günlük 2000 adım ekle.'};
  if(t.kgWeek<RATE_LO)
    return {t:t,type:'fast',sug:sug,delta:d,
      msg:'Haftada '+fx(Math.abs(t.kgWeek),2)+' kg kaybediyorsun — bu hızda kas da gider. Kaloriyi <b>'+ti(sug)+'</b>’a çıkar.'};
  return {t:t,type:'ok',sug:sug,delta:d,
    msg:'Haftada '+fx(Math.abs(t.kgWeek),2)+' kg — tam hedef aralıkta (0.3-0.7). Değiştirme, devam et.'};
}

/* ============ DELOAD ============ */
function deloadEvery(){return (S.deloadEvery==null)?7:S.deloadEvery;}
function isDeload(d){var w=weekIdx(d);return w>0&&deloadEvery()>0&&w%deloadEvery()===0;}
function nextDeload(){
  var w=weekIdx(today()),e=deloadEvery();if(w<1||!e)return null;
  if(w%e===0)return {wk:w,now:true};
  var nx=Math.ceil(w/e)*e;
  return nx<=S.weeks?{wk:nx,now:false,inWeeks:nx-w}:null;
}

/* ============ TAHMİNİ 1RM (Epley) ============
   "en ağır set kg"dan daha dürüst: 20×10 → 22.5×8 gerçekten ilerleme mi? */
function e1rm(kg,rep){if(kg==null||rep==null||rep<1)return null;return kg*(1+rep/30);}
function bestE1(sets){
  var b=0,bs=null;
  (sets||[]).forEach(function(s){
    var v=e1rm(s.kg,s.rep);if(v!=null&&v>b){b=v;bs=s;}
  });
  return bs?{v:b,kg:bs.kg,rep:bs.rep}:null;
}
/* ---- SEANS 1RM (hareket ilerlemesinin ölçüsü) ----
   Eskiden seansın değeri = EN İYİ TEK SET'in Epley'i idi. Bu yanlış sonuç
   veriyordu: 12kg × 14/10/5 (29 tekrar) → 17.6 çıkıp REKOR sayılıyor,
   12kg × 12/12/12/12 (48 tekrar) → 16.8 kalıyordu. İkincisi açıkça daha iyi
   seans. Tek set bakınca ilk setteki patlama bütün seansı temsil ediyordu.
   Yeni kural: seansın en ağır kilosuna İLK ulaşıldığı setten itibaren
   BÜTÜN setlerin Epley ortalaması.
     · öncesindeki hafif setler (ısınma / kademeli çıkış) sayılmaz
       → 40×12, 50×12, 50×12 hâlâ 70.0
     · sonrasındaki düşüş (yorgunluk) sayılır
       → 12×14, 12×10, 12×5 = 15.9  |  12×12 ×4 = 16.8  ✓ doğru sıralama
   Böylece "ilerleme" tek iyi sete değil, seansın tamamına bakar. */
function sessE1(sets){
  var f=(sets||[]).filter(function(s){return s.kg!=null&&s.rep!=null&&s.rep>=1;});
  if(!f.length)return null;
  var mx=Math.max.apply(null,f.map(function(s){return s.kg;}));
  var i0=0;for(var i=0;i<f.length;i++){if(f[i].kg===mx){i0=i;break;}}
  var work=f.slice(i0),sum=0,n=0,br=0;
  work.forEach(function(s){
    var v=e1rm(s.kg,s.rep);if(v==null)return;
    sum+=v;n++;if(s.kg===mx&&s.rep>br)br=s.rep;
  });
  if(!n)return null;
  return {v:sum/n,kg:mx,rep:br,n:n};
}

/* ============ HAFTALIK KAS GRUBU SETLERİ ============ */
/* O haftada PLANLANMIŞ günlerden gelen kas hedefi.
   Deload haftasında set sayısı yarıya iner, hedef de otomatik iner. */
function musPlanned(mon){
  var o={};MUSORD.forEach(function(k){o[k]=0;});
  for(var i=0;i<7;i++){
    var d=addD(mon,i),dt=effDt(d),t=dt?PROGRAM[dt]:null;
    if(!t||!t.ex.length)continue;
    t.ex.forEach(function(e){
      var m=EXMUS[e.n];if(!m)return;
      var need=tgtOn(e,d).s;
      Object.keys(m).forEach(function(g){if(o[g]!=null)o[g]+=need*m[g];});
    });
  }
  return o;
}
/* Bu ana kadar BEKLENEN set sayısı — kas başına.
   Sadece geçmiş antrenman günleri sayılır; bugünü ancak seansa başladıysan sayar.
   Böylece pazartesi çekiş gününde bacak/triceps "geride" görünmez. */
function musExpected(mon){
  var o={};MUSORD.forEach(function(k){o[k]=0;});
  var td=today();
  for(var i=0;i<7;i++){
    var d=addD(mon,i);
    if(d>td)continue;
    var dt=effDt(d),t=dt?PROGRAM[dt]:null;
    if(!t||!t.ex.length)continue;
    if(d===td){var ev=sessionEval(d);if(!ev||ev.empty)continue;}
    t.ex.forEach(function(e){
      var m=EXMUS[e.n];if(!m)return;
      var need=tgtOn(e,d).s;
      Object.keys(m).forEach(function(g){if(o[g]!=null)o[g]+=need*m[g];});
    });
  }
  return o;
}
function musWeek(mon){
  var o={};MUSORD.forEach(function(k){o[k]=0;});
  for(var i=0;i<7;i++){
    var d=addD(mon,i);if(d>today())continue;
    var r=D(d),ex=r.ex||{};
    Object.keys(ex).forEach(function(nm){
      var m=EXMUS[nm];if(!m)return;
      var done=ex[nm].filter(function(s){return s.kg!=null&&s.rep!=null;}).length;
      if(!done)return;
      Object.keys(m).forEach(function(g){if(o[g]!=null)o[g]+=done*m[g];});
    });
  }
  return o;
}
/* hafta içinde ne kadar ilerledik — kısmi haftada hedefi orantılamak için */
function weekProgress(mon){
  var plan=0,done=0;
  for(var i=0;i<7;i++){
    var d=addD(mon,i),dt=effDt(d),t=dt?PROGRAM[dt]:null;
    if(!t||!t.ex.length)continue;
    plan++;
    if(d<=today()){var e=sessionEval(d,dt);if(e&&!e.empty)done++;}
  }
  return {plan:plan,done:done};
}

/* ============ REKOR (PR) ============ */
function prsOn(d){
  var r=D(d),out=[];
  Object.keys(r.ex||{}).forEach(function(nm){
    var cur1=sessE1(r.ex[nm]);if(!cur1)return;
    var prevBest=0;
    keys().forEach(function(dd){
      if(dd>=d)return;
      var b=sessE1((D(dd).ex||{})[nm]);if(b&&b.v>prevBest)prevBest=b.v;
    });
    if(prevBest>0&&cur1.v>prevBest*1.005)
      out.push({n:nm,kg:cur1.kg,rep:cur1.rep,v:cur1.v,gain:(cur1.v-prevBest)/prevBest*100});
  });
  return out;
}
function isPR(name,d){
  /* rekor ölçüsü seans 1RM — tek iyi set değil (bkz. sessE1) */
  var b=sessE1((D(d).ex||{})[name]);if(!b)return false;
  var prevBest=0;
  keys().forEach(function(dd){
    if(dd>=d)return;
    var x=sessE1((D(dd).ex||{})[name]);if(x&&x.v>prevBest)prevBest=x.v;
  });
  return prevBest>0&&b.v>prevBest*1.005;
}

/* ============ UYKU ↔ PERFORMANS ============ */
function sleepInsight(){
  var lo=[],hi=[];
  keys().forEach(function(d){
    var dt=dtOf(d);if(ORDER.indexOf(dt)<0)return;
    var e=sessionEval(d,dt);if(!e||e.empty)return;
    var sl=D(addD(d,-1)).sl;if(sl==null)sl=D(d).sl;
    if(sl==null)return;
    (sl<7?lo:hi).push(e.q);
  });
  if(lo.length<3||hi.length<3)return null;
  function av(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}
  var a=av(lo),b=av(hi);
  return {lo:a,hi:b,nLo:lo.length,nHi:hi.length,diff:(b-a)*100};
}
function avgSleep(days){
  var ks=keys().filter(function(d){return d<=today()&&d>=addD(today(),-(days||7)+1);});
  var a=ks.map(function(d){return D(d).sl;}).filter(function(v){return v!=null;});
  return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;
}

/* ============ OMUZ-BEL ORANI ============ */
function lastOf(k){var a=keys().filter(function(d){return D(d)[k]!=null;});return a.length?D(a[a.length-1])[k]:null;}
function firstOf(k){var a=keys().filter(function(d){return D(d)[k]!=null;});return a.length?D(a[0])[k]:null;}
function ratioNote(r){
  if(r>=1.55)return 'V hattı belirgin — hedef aralığın üstünde';
  if(r>=1.45)return 'İyi oran, klasik hedef bandı (1.45–1.6)';
  if(r>=1.35)return 'Gelişiyor — omuz yukarı, bel aşağı';
  return 'Başlangıç seviyesi. Yan deltoid hacmi ve bel çevresi asıl kaldıraç.';
}
function ratioSeries(){
  var out=[];
  keys().forEach(function(d){var r=D(d);
    if(r.sh!=null&&r.b!=null&&r.b>0)out.push({d:d,v:r.sh/r.b});});
  return out;
}
var MEAS=[
  ['w','Kilo','kg',C.blue],['b','Bel','cm',C.teal],
  ['sh','Omuz','cm',C.green],['arm','Kol','cm',C.orange],
  ['ch','Göğüs','cm',C.pink],['sl','Uyku','saat',C.violet]
];
function measMeta(k){for(var i=0;i<MEAS.length;i++)if(MEAS[i][0]===k)return MEAS[i];return null;}

function lastW(){var a=weightSeries();return a.length?a[a.length-1].v:null;}
function lastB(){var a=keys().filter(function(d){return D(d).b!=null;});return a.length?D(a[a.length-1]).b:null;}
function firstB(){var a=keys().filter(function(d){return D(d).b!=null;});return a.length?D(a[0]).b:null;}
function weekIdx(d){var m0=monday(S.startDate);return Math.floor(dayDiff(m0,monday(d))/7)+1;}
function progDay(d){return dayDiff(S.startDate,d)+1;}
/* Başlangıç tarihinden ÖNCE de kayıt olabilir (hafta 0, -1 …).
   Takvim bu haftaları da göstersin, yoksa o antrenmanlar görünmez olur. */
function hasData(d){
  var r=S.days[d];if(!r)return false;
  if(r.dt)return true;
  if(r.ex&&Object.keys(r.ex).length)return true;
  return r.w!=null||r.b!=null||r.kcal!=null||r.st!=null||r.p!=null||
         r.sh!=null||r.arm!=null||r.ch!=null||r.sl!=null||
         !!(r.sup&&Object.keys(r.sup).length)||!!r.note;
}
function firstWeek(){
  var ks=keys().filter(hasData);
  if(!ks.length)return 1;
  return Math.min(1,weekIdx(ks[0]));
}
function wkLabel(w){return w>0?String(w):(w===0?'0':String(w));}

/* ============ ÜST BAŞLIK + KPI ============ */
function kpi(){
  var lw=lastW(),lb=lastB(),fb=firstB(),T=S.targets;
  var dw=lw!=null?lw-S.base.weight:null;
  var rem=lw!=null?lw-S.goal.weight:null;
  var pct=lw!=null?clamp((S.base.weight-lw)/(S.base.weight-S.goal.weight)*100):0;
  var db=(lb!=null&&fb!=null)?lb-fb:null;

  /* bu haftanın antrenmanı */
  var m=monday(today()),tam=0,plan=0;
  for(var i=0;i<7;i++){var d=addD(m,i),t=PROGRAM[dtOf(d)];
    if(t&&t.ex.length){plan++;var e=sessionEval(d);if(e&&!e.empty&&e.tam/e.total>=.6)tam++;}}

  var wk=weekIdx(today()),pdn=progDay(today());
  var cards=[
    {l:'Güncel kilo',v:fx(lw)+' <span style="font-size:15px;color:#a8987c">kg</span>',
      s:dw==null?'kayıt bekleniyor':(dw>0?'+':'')+fx(dw)+' kg · başlangıca göre',
      top:dw==null?'#cdbfa8':(dw<0?C.green:C.red),vc:dw==null?'#3a342c':(dw<0?C.green:C.red)},
    {l:'Hedefe kalan',v:rem==null?'—':(rem<=0?'ulaşıldı':fx(rem)+' <span style="font-size:15px;color:#a8987c">kg</span>'),
      s:Math.round(pct)+'% tamamlandı · hedef '+S.goal.weight+' kg',top:'#f4ad15',vc:'#3a342c'},
    {l:'Bel çevresi',v:lb==null?'—':fx(lb)+' <span style="font-size:15px;color:#a8987c">cm</span>',
      s:db==null?'ilk ölçüm bekleniyor':(db>0?'+':'')+fx(db)+' cm · ilk ölçüme göre',
      top:db==null?'#cdbfa8':(db<0?C.green:C.orange),vc:db==null?'#3a342c':(db<0?C.green:'#3a342c')},
    {l:'Bu hafta antrenman',v:tam+'<span style="font-size:16px;color:#a8987c"> / '+(plan||5)+'</span>',
      s:'Pzt–Paz · programlı gün',top:tam>=plan?C.green:(tam>=3?C.amber:C.orange),
      vc:tam>=plan?C.green:'#3a342c'},
    {l:'Program günü',v:(pdn>0?pdn:0)+'<span style="font-size:16px;color:#a8987c"> / '+(S.weeks*7)+'</span>',
      s:'Hafta '+(wk>0?wk:0)+' / '+S.weeks+' · başladı '+fdate(S.startDate),top:'#8b5cf6',vc:'#3a342c'}
  ];
  return '<div class="kpi">'+cards.map(function(k){
    return '<div style="border-top:3px solid '+k.top+'"><div class="eyebrow">'+k.l+'</div>'+
      '<div class="v" style="color:'+k.vc+'">'+k.v+'</div><div class="s">'+k.s+'</div></div>';
  }).join('')+'</div>';
}

/* ============ GRAFİKLER ============ */
function chartDays(){
  var ks=keys();if(!ks.length)return [];
  var last=today(),first=ks[0];
  if(first>last)first=last;
  if(dayDiff(first,last)>29)first=addD(last,-29);
  var out=[],nD=dayDiff(first,last);
  for(var i=0;i<=nD;i++)out.push(addD(first,i));
  return out;
}

/* ---------- ortak mini görsel ölçüleri ---------- */
var MW=340,MH=40,ML=4,MR=4,MT=7,MB=4;

function spark(pts,col,goal){
  if(!pts.length)return miniEmpty();
  var vs=pts.map(function(p){return p.v;});
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  var gIn=goal!=null&&goal>lo-(hi-lo||1)*1.2&&goal<hi+(hi-lo||1)*0.4;
  if(gIn){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  var pad=Math.max((hi-lo)*0.3,0.3);lo-=pad;hi+=pad;
  var n=pts.length,step=n>1?(MW-ML-MR)/(n-1):0;
  function X(i){return n>1?ML+i*step:MW/2;}
  function Y(v){return MT+(1-(v-lo)/(hi-lo))*(MH-MT-MB);}
  var id='sp'+Math.random().toString(36).slice(2,8),g='';
  g+='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0%" stop-color="'+col+'" stop-opacity=".2"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  if(gIn)g+='<line x1="'+ML+'" y1="'+Y(goal).toFixed(1)+'" x2="'+(MW-MR)+'" y2="'+Y(goal).toFixed(1)+'" stroke="'+C.green+'" stroke-width="1.2" stroke-dasharray="5 4" opacity=".85"/>';
  if(n>1){
    var line=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
    g+='<path d="'+line+' L'+X(n-1).toFixed(1)+','+(MH-MB)+' L'+X(0).toFixed(1)+','+(MH-MB)+' Z" fill="url(#'+id+')"/>'+
       '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  g+='<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(pts[n-1].v).toFixed(1)+'" r="2.9" fill="'+col+'" stroke="#fbf8f2" stroke-width="1.6"/>';
  return miniWrap(g);
}
/* ham nokta + kalın trend çizgisi */
function sparkT(pts,tr,col,goal){
  if(!pts.length)return miniEmpty();
  var all=pts.map(function(p){return p.v;}).concat(tr.map(function(p){return p.v;}));
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  var gIn=goal!=null&&goal>lo-(hi-lo||1)*1.2&&goal<hi+(hi-lo||1)*0.4;
  if(gIn){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  var pad=Math.max((hi-lo)*0.3,0.3);lo-=pad;hi+=pad;
  var d0=pts[0].d,dN=pts[pts.length-1].d,span=Math.max(1,dayDiff(d0,dN));
  function X(d){return ML+dayDiff(d0,d)/span*(MW-ML-MR);}
  function Y(v){return MT+(1-(v-lo)/(hi-lo))*(MH-MT-MB);}
  var g='';
  if(gIn)g+='<line x1="'+ML+'" y1="'+Y(goal).toFixed(1)+'" x2="'+(MW-MR)+'" y2="'+Y(goal).toFixed(1)+
    '" stroke="'+C.green+'" stroke-width="1.2" stroke-dasharray="5 4" opacity=".85"/>';
  pts.forEach(function(p){
    g+='<circle cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="1.6" fill="'+col+'" opacity=".32"/>';});
  var tw=tr.filter(function(p){return p.d>=d0;});
  if(tw.length>1){
    var ln=tw.map(function(p,i){return (i?'L':'M')+X(p.d).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
    g+='<path d="'+ln+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
       '<circle cx="'+X(tw[tw.length-1].d).toFixed(1)+'" cy="'+Y(tw[tw.length-1].v).toFixed(1)+
       '" r="2.9" fill="'+col+'" stroke="#fbf8f2" stroke-width="1.6"/>';
  }
  return miniWrap(g);
}
function miniWrap(g){return '<svg viewBox="0 0 '+MW+' '+MH+'" preserveAspectRatio="none" style="width:100%;height:'+MH+'px;display:block">'+g+'</svg>';}
function miniEmpty(){return '<div style="height:'+MH+'px;display:flex;align-items:center;color:#cdbfa8;font-size:11px;font-weight:600">veri yok</div>';}

/* dikey mini sütunlar — kalori (tek) ve makro (yığılı) */
function miniBars(ds,mode){
  var T=S.targets,n=ds.length;
  if(!n)return miniEmpty();
  var slot=(MW-ML-MR)/n,bw=Math.max(2.4,Math.min(13,slot*0.62));
  function X(i){return ML+slot*i+slot/2;}
  var max;
  if(mode==='kcal'){
    max=T.kcal*1.28;
    ds.forEach(function(d){var v=D(d).kcal;if(v!=null&&v*1.1>max)max=v*1.1;});
  }else{
    max=(T.protein+T.carbs+T.fat)*1.12;
    ds.forEach(function(d){var r=D(d),t2=(r.p||0)+(r.c||0)+(r.f||0);if(t2*1.1>max)max=t2*1.1;});
  }
  function Y(v){return (MH-MB)-(v/max)*(MH-MB-MT);}
  var g='',any=false;
  var tgt=mode==='kcal'?T.kcal:(T.protein+T.carbs+T.fat);
  g+='<line x1="'+ML+'" y1="'+Y(tgt).toFixed(1)+'" x2="'+(MW-MR)+'" y2="'+Y(tgt).toFixed(1)+'" stroke="#c4b69b" stroke-width="1.1" stroke-dasharray="4 3"/>';
  ds.forEach(function(d,i){
    var r=D(d),x=X(i)-bw/2,base=MH-MB;
    var segs;
    if(mode==='kcal'){ if(r.kcal==null)return; segs=[[r.kcal,r.kcal<=T.kcal*1.08?C.orange:C.red]]; }
    else{ if(r.p==null&&r.c==null&&r.f==null)return;
      segs=[[(r.p||0),C.green],[(r.c||0),C.amber],[(r.f||0),C.violet]]; }
    var tot=segs.reduce(function(a,b){return a+b[0];},0);
    if(!tot)return;
    any=true;
    var cid='b'+i+Math.random().toString(36).slice(2,5),top=Y(tot);
    g+='<defs><clipPath id="'+cid+'"><rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(base-top).toFixed(1)+'" rx="'+Math.min(2.5,bw/2.6).toFixed(1)+'"/></clipPath></defs>';
    var b=base;
    segs.forEach(function(sg){
      if(!sg[0])return;
      var hh=sg[0]/max*(MH-MB-MT);
      g+='<rect x="'+x.toFixed(1)+'" y="'+(b-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+sg[1]+'" clip-path="url(#'+cid+')"/>';
      b-=hh;});
  });
  return any?miniWrap(g):miniEmpty();
}

/* ---------- panel iskeleti ---------- */
function panel(label,col,valueHTML,chipHTML,visual,foot){
  return '<div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">'+
      '<div style="min-width:0"><div class="eyebrow" style="color:'+col+'">'+label+'</div>'+
      '<div class="big" style="margin-top:3px">'+valueHTML+'</div></div>'+
      (chipHTML||'')+'</div>'+
    '<div style="margin-top:4px">'+visual+'</div>'+
    '<div style="font-size:10.5px;color:#c0b193;font-weight:600">'+(foot||'')+'</div></div>';
}
function chip(txt,col,bg){return '<span class="chip" style="background:'+bg+';color:'+col+'">'+txt+'</span>';}
function statPanel(label,unit,col,pts,goal){
  var has=pts.length>0,last=has?pts[pts.length-1].v:null;
  var d=(has&&pts.length>1)?last-pts[0].v:0;
  var ch=!has?chip('kayıt yok','#a8987c','#f1e8d7')
    :chip((d>0?'+':'')+d.toFixed(1)+' '+unit,d<-0.04?C.green:d>0.04?C.orange:'#a8987c',
          d<-0.04?hexa(C.green,.14):d>0.04?hexa(C.orange,.14):'#f1e8d7');
  var vs=pts.map(function(p){return p.v;});
  var foot=has&&pts.length>1?Math.min.apply(null,vs).toFixed(1)+' – '+Math.max.apply(null,vs).toFixed(1)+' '+unit:(has?'tek ölçüm':'');
  return panel(label,col,(has?last.toFixed(1):'—')+'<span style="font-size:12px;color:#a8987c;font-weight:400;margin-left:3px">'+unit+'</span>',
    ch,spark(pts,col,goal),foot);
}

/* ---------- gelişim kartı ---------- */
function trendChart(){
  var ds=chartDays(),T=S.targets;
  var head='<div class="card"><div class="hd"><h2>Gelişim</h2><span class="meta">'+
    (ds.length?fdate(ds[0])+' – '+fdate(ds[ds.length-1]):'veri bekleniyor')+'</span></div>';
  if(!ds.length)
    return head+'<div style="padding:36px 20px;text-align:center;color:#b3a488;font-size:13px">İlk günü doldurduğunda grafik burada oluşur.</div></div>';

  var wp=ds.filter(function(d){return D(d).w!=null;}).map(function(d){return{d:d,v:D(d).w};});
  var bp=ds.filter(function(d){return D(d).b!=null;}).map(function(d){return{d:d,v:D(d).b};});

  /* kalori */
  var kd=ds.filter(function(d){return D(d).kcal!=null;});

  var kCh=kLast==null?chip('kayıt yok','#a8987c','#f1e8d7')
    :chip((kLast-T.kcal>0?'+':'')+ti(kLast-T.kcal),kLast<=T.kcal*1.08?C.green:C.red,
          kLast<=T.kcal*1.08?hexa(C.green,.14):hexa(C.red,.14));
  var kAvg=kd.length?Math.round(kd.reduce(function(a,d){return a+D(d).kcal;},0)/kd.length):null;
  var kcalPanel=panel('KALORİ',C.orange,(kLast==null?'—':ti(kLast))+'<span style="font-size:12px;color:#a8987c;font-weight:400;margin-left:3px">kcal</span>',
    kCh,miniBars(ds,'kcal'),(kAvg?'ort. '+ti(kAvg)+' · hedef '+ti(T.kcal):'hedef '+ti(T.kcal)));

  /* makro */
  var md=ds.filter(function(d){var r=D(d);return r.p!=null||r.c!=null||r.f!=null;});
  var mr=md.length?D(md[md.length-1]):null;
  var mVal=mr?('<span style="color:'+C.green+'">'+Math.round(mr.p||0)+'</span>'+
    '<span style="color:#d5c9b1;font-weight:400">/</span><span style="color:'+C.amber+'">'+Math.round(mr.c||0)+'</span>'+
    '<span style="color:#d5c9b1;font-weight:400">/</span><span style="color:'+C.violet+'">'+Math.round(mr.f||0)+'</span>'+
    '<span style="font-size:12px;color:#a8987c;font-weight:400;margin-left:4px">g</span>'):'—';
  var mCh=!mr?chip('kayıt yok','#a8987c','#f1e8d7')
    :chip((mr.p||0)>=T.protein?'protein tamam':ti(T.protein-(mr.p||0))+' g protein',
      (mr.p||0)>=T.protein?C.green:C.orange,(mr.p||0)>=T.protein?hexa(C.green,.14):hexa(C.orange,.14));
  var macroPanel=panel('MAKRO · P / K / Y',C.violet,mVal,mCh,miniBars(ds,'macro'),
    'hedef '+T.protein+' / '+T.carbs+' / '+T.fat+' g');

  var duo='<div class="duo">'+
    statPanel('KİLO','kg',C.blue,wp,S.goal.weight)+
    statPanel('BEL ÇEVRESİ','cm',C.teal,bp,null)+
    kcalPanel+macroPanel+'</div>';

  /* gym şeridi */
  var dots=ds.map(function(d){
    var dt=effDt(d),bg='#eae0cc',br='';
    if(dt==='rest'||dt==='cardio'||dt==='trav'){bg='#fbf8f2';br='border:1.6px solid #cdbfa8;';}
    else if(dt){var e=sessionEval(d);
      if(e&&!e.empty&&e.tam/e.total>=.6)bg=C.green;
      else if(e&&!e.empty)bg=C.amber;
      else bg=(d<today()?C.red:'#eae0cc');}
    return '<span title="'+esc(fdate(d))+'" style="flex:1;max-width:11px;aspect-ratio:1;border-radius:50%;background:'+bg+';'+br+'"></span>';
  }).join('');
  var strip='<div style="padding:9px 14px 6px;border-top:1px solid #ece1cd;display:flex;align-items:center;gap:10px">'+
      '<span class="eyebrow" style="flex:none">GYM</span>'+
      '<div style="flex:1;display:flex;gap:3px;align-items:center;justify-content:flex-start">'+dots+'</div></div>'+
    '<div class="legend" style="padding:0 14px 11px;font-size:10.5px">'+
      '<i style="background:'+C.green+';border-radius:50%"></i>tamam'+
      '<i style="background:'+C.amber+';border-radius:50%"></i>eksik'+
      '<i style="background:'+C.red+';border-radius:50%"></i>yapılmadı'+
      '<i style="background:#fbf8f2;border:2px solid #cdbfa8;border-radius:50%"></i>dinlenme</div>';

  return head+duo+strip+'</div>';
}

function adherence(){
  var T=S.targets,ks=keys().filter(function(d){return d<=today();}).slice(-7);
  if(!ks.length)return card('Son 7 Gün Uyum','—','<div style="padding:40px 20px;text-align:center;color:#b3a488;font-size:13.5px">Henüz kayıt yok.</div>');
  function avg(k){var a=ks.map(function(d){return D(d)[k];}).filter(function(v){return v!=null;});
    return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  var gymPlan=0,gymDone=0;
  ks.forEach(function(d){var t=PROGRAM[dtOf(d)];if(t&&t.ex.length){gymPlan++;var e=sessionEval(d);if(e&&!e.empty&&e.tam/e.total>=.6)gymDone++;}});
  var rows=[
    {l:'Adım',v:avg('st'),t:T.steps,c:C.orange,u:''},
    {l:'Protein',v:avg('p'),t:T.protein,c:C.green,u:'g'},
    {l:'Karbonhidrat',v:avg('c'),t:T.carbs,c:C.amber,u:'g'},
    {l:'Yağ',v:avg('f'),t:T.fat,c:C.violet,u:'g'},
    {l:'Kalori',v:avg('kcal'),t:T.kcal,c:C.blue,u:'',inv:true},
    {l:'Antrenman',v:gymDone,t:gymPlan||1,c:C.pink,u:'',raw:true},
    {l:'Kreatin',v:supRate('kreatin',7),t:7,c:C.violet,u:'',raw:true}
  ];
  var body='<div style="padding:16px 18px;display:grid;grid-template-columns:repeat(2,1fr);gap:13px 18px">'+rows.map(function(r){
    var p=r.v==null?0:clamp(r.v/r.t*100);
    var col=r.v==null?'#dfd4bd':(r.inv?(r.v<=r.t*1.08?r.c:C.red):(p>=95?r.c:p>=75?C.amber:C.orange));
    var txt=r.v==null?'—':(r.raw?r.v+' / '+r.t:ti(r.v)+(r.u?' '+r.u:'')+' · hedef '+ti(r.t));
    return '<div><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:700">'+
      '<span>'+r.l+'</span><span style="color:#a8987c;font-weight:600">'+txt+'</span></div>'+
      '<div class="mbar" style="height:7px;margin-top:5px"><i style="width:'+p.toFixed(0)+'%;background:'+col+'"></i></div></div>';
  }).join('')+'</div>';
  return card('Son 7 Gün Ortalaması',ks.length+' gün',body);
}
function card(title,meta,body,cls,body2){

      metric(0,'b','Bel','cm',null,C.teal)+

      metric(0,'kcal','Kalori','',T.kcal,C.blue,true)+
      metric(0,'p','Protein','g',T.protein,C.green)+
      metric(0,'c','Karbonhidrat','g',T.carbs,C.amber)+
    '</div>'+
    '<div class="metrics">'+
      metric(0,'sh','Omuz','cm',null,C.green)+
      metric(0,'arm','Kol','cm',null,C.orange)+
      metric(0,'ch','Göğüs','cm',null,C.pink)+
      metric(0,'sl','Uyku','saat',null,C.violet)+
      (function(){var rt=(r.sh!=null&&r.b)?r.sh/r.b:null;
        return '<div style="grid-column:span 2"><label>Omuz / bel oranı</label>'+
          '<div style="display:flex;align-items:baseline;gap:9px">'+
            '<div style="font-family:Fraunces;font-size:22px;font-weight:600;color:'+(rt!=null?C.green:'#dfd4bd')+'">'+(rt!=null?fx(rt,2):'—')+'</div>'+

function hexa(hex,a){var h=hex.replace('#','');return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')';}
function macroBar(r){
  var pk=(r.p||0)*4,ck=(r.c||0)*4,fk=(r.f||0)*9,tot=pk+ck+fk;
  if(!tot)return '<div class="mbar" style="height:14px"></div><div class="mhint">makro gir</div>';

  return '<div style="display:flex;height:14px;border-radius:5px;overflow:hidden;background:#efe7d6">'+
    '<div style="width:'+q(pk)+';background:'+C.green+'"></div>'+
    '<div style="width:'+q(ck)+';background:'+C.amber+'"></div>'+
    '<div style="width:'+q(fk)+';background:'+C.violet+'"></div></div>'+
  '<div class="mhint">P '+Math.round(pk/tot*100)+'% · K '+Math.round(ck/tot*100)+'% · Y '+Math.round(fk/tot*100)+'%</div>';
}
function exRow(e,r){
  var sets=(r.ex||{})[e.n]||[];
  var te=tgtOn(e,cur),count=Math.max(te.s,sets.length);
  var prev=prevSession(e.n,cur),ev=evalEx(sets,te,prev);
  var boxes='';
  for(var i=0;i<count;i++){
    var s=sets[i]||{kg:null,rep:null};
    var up=(i>0&&sets[i-1]&&sets[i-1].kg!=null)?sets[i-1]:null;
    var ph=up||(prev&&prev.sets&&prev.sets[i]?prev.sets[i]:null);
    boxes+='<div class="setbox'+((s.kg!=null||s.rep!=null)?' filled':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+
      '<input data-s="kg" inputmode="decimal" placeholder="'+(ph&&ph.kg!=null?ph.kg:'kg')+'" value="'+(s.kg==null?'':s.kg)+'">'+
      '<span class="x">×</span>'+
      '<input data-s="rep" inputmode="numeric" placeholder="'+(ph&&ph.rep!=null?ph.rep:(e.r[0]+'-'+e.r[1]))+'" value="'+(s.rep==null?'':s.rep)+'">'+
      '<select class="rirsel" data-s="rir" title="Yetersizliğe kalan tekrar">'+
        '<option value="">RIR</option>'+
        RIRV.map(function(rv){return '<option value="'+rv[0]+'"'+(s.rir===rv[0]?' selected':'')+'>'+rv[1]+'</option>';}).join('')+
      '</select>'+
      '<button class="wipe" data-a="setwipe" data-i="'+i+'" aria-label="Seti temizle">✕</button>'+
      (i>=te.s?'<button data-a="delset" aria-label="Seti sil">×</button>':'')+'</div>';
  }
  var tr='';
  if(prev&&ev.vol>0){var p=(ev.vol-prev.vol)/prev.vol*100;
    tr='<span style="color:'+(p>1?C.green:p<-1?C.orange:'#a8987c')+'"><b>'+(p>0?'+':'')+p.toFixed(0)+'%</b> hacim</span>';}
  return '<div class="exrow" data-ex="'+esc(e.n)+'">'+
    '<div style="display:flex;gap:12px;align-items:flex-start">'+
      '<button class="thumb" data-a="fig" data-n="'+esc(e.n)+'" aria-label="'+esc(e.n)+' çizimini büyüt">'+figSVG(e.n)+'</button>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="exhd"><span class="exname">'+esc(e.n)+'</span>'+
          '<span class="extgt">'+e.s+' × '+e.r[0]+'-'+e.r[1]+(e.off?' · PLAN DIŞI':'')+'</span>'+
          '<span class="badge" data-badge style="color:'+ev.color+';background:'+ev.bg+'">'+ev.label+'</span></div>'+
        '<div class="exdesc">'+esc(descOf(e.n))+'</div>'+
        (function(){var pg=progression(e.n);if(!pg)return '';
          var col=pg.type==='up'?C.green:(pg.type==='ok'?C.teal:C.amber);

          return '<div style="margin-top:6px;display:inline-block;font-size:11.5px;font-weight:700;border-radius:7px;padding:4px 9px;background:'+hexa(col,.13)+';color:'+col+'">'+tx+'</div>';})()+
        '<div class="sets">'+boxes+'<button class="addset" data-a="addset">+ set</button></div>'+
        '<div class="exft"><span data-vol>hacim <b>'+ti(ev.vol)+'</b> kg</span>'+
          (prev?'<span>önceki '+fdate(prev.date)+': <b>'+esc(prev.txt)+'</b></span>':'<span>ilk kez yapılıyor</span>')+
          '<span data-trend>'+tr+'</span></div>'+
      '</div></div></div>';
}
function sessionLine(d,ov){
  var e=sessionEval(d,ov);

  return '<span style="color:'+e.vcolor+'">'+e.verdict+'</span> · '+e.tam+'/'+e.total+' tamam'+
    (e.off?' (+'+e.off+' plan dışı)':'')+' · toplam hacim <b>'+ti(e.vol)+' kg</b>'+t;
}

var wkOffset=0;
function weekTable(){
  var m=addD(monday(today()),wkOffset*7),T=S.targets;
  var days=[];for(var i=0;i<7;i++)days.push(addD(m,i));
  var GRIDW='150px repeat(7,minmax(0,1fr)) 92px';
  function avg(vals){var a=vals.filter(function(v){return v!=null;});return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  function sum(vals){var a=vals.filter(function(v){return v!=null;});return a.length?a.reduce(function(x,y){return x+y;},0):null;}

  function row(label,get,fmtf,agg,color){
    var vals=days.map(get);
    var av=agg==='sum'?sum(vals):avg(vals);
    return '<div class="c l">'+label+'</div>'+
      days.map(function(d,i){
        var v=vals[i],cls='c'+(d===today()?' today':'');
        return '<div class="'+cls+'" style="color:'+(v==null?'#d5c9b1':(color||'#3a342c'))+'">'+(v==null?'·':fmtf(v))+'</div>';
      }).join('')+
      '<div class="c avg">'+(av==null?'·':fmtf(av))+'</div>';
  }
  function tgtRow(label,key,tgt,unit,inv){
    var vals=days.map(function(d){return D(d)[key];});
    var a=vals.filter(function(v){return v!=null;});
    var av=a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;
    return '<div class="c l">'+label+'<span style="color:#c0b193;font-weight:600;margin-left:5px">'+ti(tgt)+unit+'</span></div>'+
      days.map(function(d,i){
        var v=vals[i],col='#d5c9b1';
        if(v!=null)col=inv?(v<=tgt*1.08?C.green:C.red):(v>=tgt?C.green:v>=tgt*.75?'#c99a12':C.orange);
        return '<div class="c'+(d===today()?' today':'')+'" style="color:'+col+';font-weight:'+(v!=null?700:400)+'">'+(v==null?'·':ti(v))+'</div>';
      }).join('')+
      '<div class="c avg">'+(av==null?'·':ti(av))+'</div>';
  }
  function supTblRow(){
    var hit=0;
    var cells=days.map(function(d){
      var on=tookSup(d,'kreatin');if(on)hit++;
      return '<div class="c'+(d===today()?' today':'')+'" style="color:'+(on?C.violet:'#d5c9b1')+';font-weight:700">'+(on?'✓':'·')+'</div>';

function tookSup(d,k){var r=S.days[d];return !!(r&&r.sup&&r.sup[k]);}
function supStreak(k){

/* ============ PROGRESİF YÜKLENME ============ */
var _gc={};
function nextWeight(kg){var inc=kg<20?1:(kg<40?2:2.5);return Math.round((kg+inc)*4)/4;}
/* ============ RIR — yetersizliğe kalan tekrar ============
   Yetersizliğe yakınlık, hipertrofi uyarımının ana belirleyicilerinden.
   0 = ≤1 tekrar kalmıştı, 2 = 2 kalmıştı, 3 = 3 veya daha fazla. */
var RIRV=[[0,'≤1',C.orange],[2,'2',C.green],[3,'3+',C.amber]];
var RIRT={0:'sınıra çok yakın',2:'ideal aralık',3:'efor düşük — ağırlığı artır'};
function RIRL(v){return v===0?'≤1':(v===3?'3+':String(v));}
function kgStep(kg){
  if(kg==null)return 2.5;
  if(kg<10)return .5;
  if(kg<20)return 1;
  if(kg<45)return 2.5;
  return 5;
}
/* seansın ortalama RIR'ı — efor takibi */
function avgRir(sets){
  var a=(sets||[]).filter(function(s){return s.rir!=null&&s.kg!=null&&s.rep!=null;});
  if(!a.length)return null;
  return a.reduce(function(x,s){return x+s.rir;},0)/a.length;
}
function exSessions(name){
  return keys().filter(function(d){
    var st=(D(d).ex||{})[name];
    return st&&st.some(function(s){return s.kg!=null&&s.rep!=null;});
  }).sort();
}
function progression(name){
  if(name in _gc)return _gc[name];
  var out=_progression(name);_gc[name]=out;return out;
}
function _progression(name){
  var ss=exSessions(name);if(!ss.length)return null;
  var last=ss[ss.length-1];
  /* hedef, hareketin SON YAPILDIĞI GÜNDEN okunur — EXTGT'den değil.
     Yoksa Üst gününde yapılan Eğik dambıl press'e İtiş gününün 6-10
     hedefiyle not verilir ve antrenman sayfasıyla çelişen uyarı çıkar. */
  var e=tgtFor(name,last);if(!e)return null;
  var sets=((D(last).ex||{})[name]||[]).filter(function(s){return s.kg!=null&&s.rep!=null;});
  if(!sets.length)return null;
  var mx=Math.max.apply(null,sets.map(function(s){return s.kg;}));
  var atMax=sets.filter(function(s){return s.kg===mx;});
  var topHit=atMax.filter(function(s){return s.rep>=e.r[1];}).length;
  var rir=avgRir(sets);

  /* aynı ağırlıkta üst üste kaç seans */
  var streak=0,firstAt=last;
  for(var i=ss.length-1;i>=0;i--){
    var st2=((D(ss[i]).ex||{})[name]||[]).filter(function(s){return s.kg!=null&&s.rep!=null;});
    if(!st2.length)break;
    if(Math.max.apply(null,st2.map(function(s){return s.kg;}))!==mx)break;
    streak++;firstAt=ss[i];
  }
  var days=dayDiff(firstAt,last),nx=nextWeight(mx);
  var dl=isDeload(today());

  /* RIR 3+ ise setler yeterince zorlamıyor — tekrar aralığından bağımsız uyar */
  if(rir!=null&&rir>=2.6&&!dl)
    return {type:'up',kg:mx,next:nx,streak:streak,days:days,last:last,rir:rir,
      msg:'Ortalama RIR '+fx(rir,1)+' — setler yetersizliğe uzak, uyarım düşük. <b>'+nx+' kg</b>’a çık.'};

  /* Ağırlık artırma şartı: hedeflenen set sayısının TAMAMI aynı kiloda
     yapılmış VE hepsi üst sınıra ulaşmış olmalı.
     Eski şart min(e.s, atMax.length) idi: 3 setlik hedefte 2. seti girer
     girmez "çık" diyordu — seans daha bitmemişken. */
  if(atMax.length>=e.s&&topHit>=e.s){
    if(dl)return {type:'stall',kg:mx,next:nx,streak:streak,days:days,last:last,rir:rir,
      msg:'Bu hafta deload — ağırlığı koru, artırmayı gelecek haftaya bırak.'};
    return {type:'up',kg:mx,next:nx,streak:streak,days:days,last:last,rir:rir,
      msg:'Tüm setlerde '+e.r[1]+' tekrara ulaştın. <b>'+nx+' kg</b>’a çık, '+e.r[0]+'-'+e.r[1]+' aralığına geri dön.'};
  }

  /* RIR düşüyorsa aynı kiloda kalmak takılmak değil — gerçek ilerleme */
  if(streak>=3||(streak>=2&&days>=14)){
    var tr=rirTrend(name,ss);
    if(tr!=null&&tr<=-0.5)
      return {type:'ok',kg:mx,next:nx,streak:streak,days:days,last:last,rir:rir,
        msg:streak+' seanstır '+mx+' kg ama RIR düşüyor ('+fx(tr,1)+') — takılmadın, aynı yükte güçleniyorsun.'};
    if(dl)return null;
    return {type:'stall',kg:mx,next:nx,streak:streak,days:days,last:last,rir:rir,
      msg:streak+' seanstır '+mx+' kg'+(days>=7?' ('+days+' gündür)':'')+'. Önce her sette '+e.r[1]+' tekrarı yakala, sonra '+nx+' kg’a geç.'};
  }
  return null;
}
/* son iki seansın ortalama RIR farkı */
function rirTrend(name,ss){
  if(ss.length<2)return null;
  var a=avgRir((D(ss[ss.length-1]).ex||{})[name]);
  var b=avgRir((D(ss[ss.length-2]).ex||{})[name]);
  if(a==null||b==null)return null;
  return a-b;
}
function progressCard(){
  var ups=[],stalls=[];
  Object.keys(EXTGT).forEach(function(n){
    var p=progression(n);if(!p)return;
    if(p.type==='ok')return;
    (p.type==='up'?ups:stalls).push([n,p]);
  });
  if(!ups.length&&!stalls.length){
    var tracked=Object.keys(EXTGT).filter(function(n){return exSessions(n).length;}).length;
    return '<div class="card"><div class="hd"><h2>Ağırlık Artırma</h2>'+

      (tracked
        ?'Şu an artırılacak hareket yok — hepsi hedef tekrar aralığının içinde ilerliyor.'
        :'Antrenmanda kg × tekrar girmeye başladığında buraya öneriler düşecek.')+
      '<div style="margin-top:10px;font-size:12px;color:#a8987c">'+
        '<b style="color:'+C.green+'">↑ Hazır</b> — bir hareketin tüm setlerinde hedef aralığın üst sınırına ulaştığında yeni ağırlığı önerir.<br>'+
        '<b style="color:'+C.amber+'">≡ Takıldı</b> — aynı ağırlıkta 3 seans geçirdiğinde ya da 2 seans + 14 gün olduğunda uyarır.'+
      '</div></div></div>';
  }
  function row(n,p){
    var up=p.type==='up',col=up?C.green:C.amber;
    return '<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 18px;border-top:1px solid #f0e8d8">'+
      '<span style="flex:none;width:26px;height:26px;border-radius:8px;background:'+hexa(col,.14)+';color:'+col+
        ';font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center">'+(up?'↑':'≡')+'</span>'+
      '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13.5px">'+esc(n)+
        '<span style="font-weight:600;color:#c0b193;margin-left:7px">'+p.kg+' kg</span></div>'+
      '<div style="font-size:12px;color:#8a7f6f;line-height:1.45;margin-top:2px">'+p.msg+'</div></div>'+
      (up?'<span class="chip" style="background:'+hexa(C.green,.14)+';color:'+C.green+';flex:none">'+p.next+' kg</span>':'')+
    '</div>';
  }
  return '<div class="card"><div class="hd"><h2>Ağırlık Artırma</h2>'+
    '<span class="meta">'+(ups.length?ups.length+' hareket hazır':'')+(ups.length&&stalls.length?' · ':'')+
    (stalls.length?stalls.length+' takıldı':'')+'</span></div>'+
    ups.map(function(x){return row(x[0],x[1]);}).join('')+
    stalls.map(function(x){return row(x[0],x[1]);}).join('')+
  '</div>';
}

var GFILE='form-takip.json', syncing=false, pushT=null, syncMsg='';
function ghWait0(ms){return new Promise(function(r){setTimeout(r,ms);});}
function gh(path,opts,tryN){

    cache:'no-store',
    headers:{'Authorization':'Bearer '+S.sync.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    if(r.status===401)throw new Error('Anahtar geçersiz veya süresi dolmuş — yeni anahtar üret');
    if(r.status===404)throw new Error('Gist bulunamadı — ID’yi kontrol et');
    if(r.status===403||r.status===429){
      var rem=r.headers.get('x-ratelimit-remaining');
      var rst=r.headers.get('x-ratelimit-reset');
      var ra=r.headers.get('retry-after');
      return r.text().then(function(tx){
        var msg='';try{msg=(JSON.parse(tx).message)||'';}catch(e){}
        /* istek sınırı: bekle ve tekrar dene */
        if(ra||rem==='0'||/rate limit|secondary|abuse/i.test(msg)){
          if(tryN<3)return ghWait0((ra?Math.min(+ra,20)*1000:3000*(tryN+1))).then(function(){
            return gh(path,opts,tryN+1);});
          var wait='';
          if(rst){var sec=Math.max(0,Math.round(+rst-Date.now()/1000));
            wait=' — '+(sec<90?sec+' sn':Math.ceil(sec/60)+' dk')+' sonra tekrar dene';}
          else if(ra)wait=' — '+ra+' sn sonra tekrar dene';
          throw new Error('GitHub istek sınırı doldu'+wait);
        }
        /* yetki sorunu */
        throw new Error('Anahtarın yetkisi yetmiyor. Classic token olmalı ve “gist” + “repo” '+
          'kutuları işaretli olmalı (fine-grained token gist’i desteklemez).');
      });
    }
    if(r.status>=500&&tryN<3)return ghWait0(1200*(tryN+1)).then(function(){return gh(path,opts,tryN+1);});
    if(!r.ok)return r.text().then(function(tx){
      var m2='';try{m2=(JSON.parse(tx).message)||'';}catch(e){m2=tx.slice(0,90);}
      throw new Error('GitHub '+r.status+(m2?' — '+m2:''));
    });
    return r.json();
  });
}

function payload(){
  return {v:2,days:S.days,plan:S.plan,_pt:S._pt||0,_st:S._st||0,
    startDate:S.startDate,weeks:S.weeks,restDays:S.restDays,restWeeks:S.restWeeks,photoRepo:(S.sync&&S.sync.repo)||'',
    base:S.base,goal:S.goal,targets:S.targets,deloadEvery:S.deloadEvery,autoTargets:S.autoTargets,
    phDel:_phDel};

/* gün gün birleştir: her iki tarafta da en yeni kayıt kazanır */
function mergeRemote(rm){
  var ch=0;
  Object.keys(rm.days||{}).forEach(function(d){
    var r=rm.days[d],l=S.days[d];
    if(!l||(r._t||0)>(l._t||0)){S.days[d]=r;ch++;}
  });
  /* takvim planı: günü gün birleştir. Karşı taraf daha yeniyse çakışanlarda o kazanır,
     ama sadece bir tarafta olan günler her hâlükârda korunur. */
  if(rm.plan){
    S.plan=S.plan||{};
    var newer=(rm._pt||0)>(S._pt||0);
    Object.keys(rm.plan).forEach(function(k){
      if(!(k in S.plan)){S.plan[k]=rm.plan[k];ch++;}
      else if(newer&&S.plan[k]!==rm.plan[k]){S.plan[k]=rm.plan[k];ch++;}
    });
    if(newer){
      Object.keys(S.plan).forEach(function(k){if(!(k in rm.plan)){delete S.plan[k];ch++;}});
      S._pt=rm._pt;
    }
  }
  if(rm.photoRepo&&!S.sync.repo){S.sync.repo=rm.photoRepo;ch++;}
  /* silme listesi birleşir (hiç geri alınmaz): bir cihazda silinen her yerde silinir */
  if(rm.phDel&&typeof rm.phDel==='object'){
    var pdn=0;
    Object.keys(rm.phDel).forEach(function(k){if(!_phDel[k]){_phDel[k]=rm.phDel[k];pdn++;}});
    if(pdn){savePhDel();phApplyDeletes();ch++;}
  }
  if((rm._st||0)>(S._st||0)){
    ['startDate','weeks','restDays','restWeeks','base','goal','targets','deloadEvery','autoTargets'].forEach(function(k){
      if(rm[k]!=null)S[k]=rm[k];});
    S._st=rm._st;ch++;
  }
  return ch;
}

/* --- özet: veri toplayıcılar --- */
function exSessionsData(name){
  return exSessions(name).map(function(d){
    var f=((D(d).ex||{})[name]||[]).filter(function(x){return x.kg!=null&&x.rep!=null;});
    var vol=0,top=0,topRep=0,reps=0;
    f.forEach(function(x){vol+=x.kg*x.rep;reps+=x.rep;
      if(x.kg>top){top=x.kg;topRep=x.rep;}else if(x.kg===top&&x.rep>topRep)topRep=x.rep;});
    var be=sessE1(f);
    return {d:d,vol:vol,top:top,topRep:topRep,reps:reps,sets:f,
      e1:be?be.v:0,e1kg:be?be.kg:0,e1rep:be?be.rep:0,rir:avgRir(f)};
  });
}
function volByWeek(){
  var m={};
  keys().forEach(function(d){
    if(d>today())return;
    var dt=dtOf(d);if(ORDER.indexOf(dt)<0)return;
    var e=sessionEval(d,dt);if(!e||e.empty)return;
    var w=weekIdx(d);
    m[w]=m[w]||{wk:w,total:0,reps:0,by:{}};
    m[w].total+=e.vol;m[w].by[dt]=(m[w].by[dt]||0)+e.vol;
    dayEx(d,dt).forEach(function(x){
      ((D(d).ex||{})[x.n]||[]).forEach(function(st){if(st.rep!=null)m[w].reps+=st.rep;});
    });
  });
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.wk-b.wk;});
}
function volByType(){
  var out={},cnt={};ORDER.forEach(function(k){out[k]=0;cnt[k]=0;});
  keys().forEach(function(d){
    if(d>today())return;
    var dt=dtOf(d);if(ORDER.indexOf(dt)<0)return;
    var e=sessionEval(d,dt);if(!e||e.empty)return;
    out[dt]+=e.vol;cnt[dt]++;
  });
  return {vol:out,cnt:cnt};
}
function typeExercises(k){
  return PROGRAM[k].ex.map(function(e){
    var h=exSessionsData(e.n);
    var last=h.length?h[h.length-1]:null,first=h.length?h[0]:null;
    return {e:e,h:h,last:last,
      gain:(last&&first&&first.e1>0)?((last.e1-first.e1)/first.e1*100):null};
  }).filter(function(x){return x.h.length;});
}

/* --- özet: küçük grafik parçaları --- */
function volBars(rows,onTapKind){
  if(!rows.length)return '<div class="sempty">Antrenman girdikçe burada birikecek</div>';
  var W=340,H=104,PL=6,PR=6,TP=14,BT=22;
  var n=rows.length,slot=(W-PL-PR)/n,bw=Math.max(6,Math.min(30,slot*0.62));
  var mx=Math.max.apply(null,rows.map(function(r){return r.total;}))*1.12||1;
  var g='';
  rows.forEach(function(r,i){
    var x=PL+slot*i+slot/2-bw/2,base=H-BT,b=base;
    var cid='v'+i+Math.random().toString(36).slice(2,5),top=base-(r.total/mx)*(base-TP);
    g+='<defs><clipPath id="'+cid+'"><rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(base-top).toFixed(1)+'" rx="'+Math.min(5,bw/2.4).toFixed(1)+'"/></clipPath></defs>';
    ORDER.forEach(function(k){
      var v=r.by[k];if(!v)return;
      var hh=(v/mx)*(base-TP);
      g+='<rect x="'+x.toFixed(1)+'" y="'+(b-hh).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hh.toFixed(1)+'" fill="'+PROGRAM[k].color+'" clip-path="url(#'+cid+')" opacity=".92"/>';
      b-=hh;});
    g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#b3a488" font-family="Karla">H'+r.wk+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:104px;display:block">'+g+'</svg>';
}
function typeDonut(tv){
  var tot=0;ORDER.forEach(function(k){tot+=tv.vol[k];});
  if(!tot)return '<div class="sempty">Henüz hacim yok</div>';
  var R=54,C2=2*Math.PI*R,off=0,g='';
  ORDER.forEach(function(k){
    var v=tv.vol[k];if(!v)return;
    var len=v/tot*C2;
    g+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+PROGRAM[k].color+'" stroke-width="17" '+
       'stroke-dasharray="'+len.toFixed(1)+' '+(C2-len).toFixed(1)+'" stroke-dashoffset="'+(-off).toFixed(1)+'" transform="rotate(-90 70 70)"/>';
    off+=len;});
  return '<div class="sdonut"><svg viewBox="0 0 140 140">'+g+
    '<text x="70" y="66" text-anchor="middle" font-size="11" fill="#a8987c" font-family="Karla" font-weight="700">TOPLAM</text>'+
    '<text x="70" y="86" text-anchor="middle" font-size="17" fill="#3a342c" font-family="Fraunces" font-weight="600">'+ti(tot)+'</text>'+
    '</svg><div class="slegend">'+ORDER.map(function(k){
      var v=tv.vol[k];
      return '<button class="srow" data-a="dopen" data-kind="type" data-key="'+k+'">'+
        '<span class="sdot" style="background:'+PROGRAM[k].color+'"></span>'+
        '<span class="sname">'+esc(PROGRAM[k].name)+'</span>'+
        '<span class="sval">'+(v?ti(v)+' kg':'—')+'</span><span class="schev">›</span></button>';
    }).join('')+'</div></div>';
}
function miniLine(vals,col){
  if(vals.length<2)return '<svg viewBox="0 0 100 30" style="width:74px;height:26px"></svg>';
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(hi===lo){hi+=1;lo-=1;}
  var pts=vals.map(function(v,i){return (4+i*(92/(vals.length-1))).toFixed(1)+','+(26-((v-lo)/(hi-lo))*22).toFixed(1);});
  return '<svg viewBox="0 0 100 30" style="width:74px;height:26px;display:block">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+pts[pts.length-1].split(',')[0]+'" cy="'+pts[pts.length-1].split(',')[1]+'" r="2.8" fill="'+col+'"/></svg>';
}
