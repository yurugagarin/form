/* --- gerçek bakım kalorisi kartı --- */
/* ============ OTOMATİK HEDEFLER ============
   Kilo düştükçe bakım kalorisi de düşer; sabit hedef zamanla yanlışlaşır.
   Protein ve yağ vücut ağırlığına bağlanır, karbonhidrat kalan kaloriden çıkar. */
var PROT_PER_KG=2.1, FAT_PER_KG=0.8;
function autoTargets(){
  var t=tdee();if(!t.ok)return null;
  var w=trendNow();if(w==null)return null;
  var kcal=Math.round((t.tdee+RATE_TGT*KCAL_PER_KG/7)/10)*10;
  var prot=Math.round(w*PROT_PER_KG/5)*5;
  var fat=Math.round(w*FAT_PER_KG/5)*5;
  var rest=kcal-(prot*4+fat*9);
  var carb=Math.max(60,Math.round(rest/4/5)*5);
  return {kcal:kcal,protein:prot,fat:fat,carbs:carb,w:w,tdee:t.tdee,conf:t.conf};
}
function autoDiff(){
  var a=autoTargets();if(!a)return null;
  var T=S.targets;
  var d={kcal:a.kcal-T.kcal,protein:a.protein-T.protein,carbs:a.carbs-T.carbs,fat:a.fat-T.fat};
  d.any=Math.abs(d.kcal)>=60||Math.abs(d.protein)>=10||Math.abs(d.carbs)>=15||Math.abs(d.fat)>=8;
  d.a=a;return d;
}
/* auto açıksa hedefleri sessizce güncel tut */
function syncAutoTargets(){
  if(!S.autoTargets)return false;
  var d=autoDiff();if(!d||!d.any)return false;
  S.targets.kcal=d.a.kcal;S.targets.protein=d.a.protein;
  S.targets.carbs=d.a.carbs;S.targets.fat=d.a.fat;
  S._st=Date.now();
  return true;
}
function autoCard(){
  var d=autoDiff();
  var on=!!S.autoTargets;
  var head='<div class="shead"><div><div class="stitle">Otomatik Hedef</div>'+
    '<div class="ssub">'+(on?'açık · kilo düştükçe kendi ayarlanır':'kapalı · hedefler elle')+'</div></div>'+
    '<button class="tgl'+(on?' on':'')+'" data-a="autotgt" aria-label="Otomatik hedefi aç/kapat"><i></i></button></div>';
  if(!d)
    return '<div class="scard static dom dom-nut">'+head+
      '<div class="sempty" style="padding:14px 6px">Yeterli veri yok — en az 8 gün kilo ve 7 gün kalori gerekiyor.</div></div>';
  var a=d.a;
  var rows=[['Kalori',a.kcal,'kcal',d.kcal],['Protein',a.protein,'g',d.protein],
    ['Karbonhidrat',a.carbs,'g',d.carbs],['Yağ',a.fat,'g',d.fat]];
  return '<div class="scard static dom dom-nut">'+head+
    '<div class="mstats" style="margin-bottom:10px">'+rows.map(function(x){

        '<div class="s" style="color:'+dc+'">'+(x[3]>0?'+':'')+x[3]+' fark</div></div>';}).join('')+'</div>'+
    '<div class="sfoot">'+fx(a.w,1)+' kg trend · bakım '+ti(a.tdee)+' kcal · protein '+PROT_PER_KG+' g/kg · yağ '+FAT_PER_KG+' g/kg</div>'+
    (on?'':(d.any?'<button class="mbtn dark" data-a="applyauto" style="margin-top:9px">Hedefleri şimdi güncelle</button>'
                 :'<div class="sfoot" style="margin-top:6px">Mevcut hedeflerin zaten uygun.</div>'))+

/* --- haftalık kas grubu setleri --- */
function musCard(mw,mt,wp,mex){
  var rows=MUSORD.filter(function(k){return mt[k]>0;}).map(function(k){
    var tgt=mt[k],exp=mex[k],have=mw[k];
    var pct=tgt?Math.min(100,have/tgt*100):0;
    var epct=tgt?Math.min(100,exp/tgt*100):0;
    var behind=exp>0&&have<exp*0.85;
    var col=behind?C.orange:(have>0?MUS[k].c:'#cdbfa8');
    return '<div class="musrow">'+
      '<span class="musn"'+(MUS[k].pri?' style="font-weight:800"':'')+'>'+MUS[k].s+
        (MUS[k].pri?'<i class="muspri">öncelik</i>':'')+'</span>'+
      '<span class="mustrack"><i style="width:'+pct.toFixed(0)+'%;background:'+col+'"></i>'+
        (exp>0&&epct<99?'<u style="left:'+epct.toFixed(0)+'%"></u>':'')+'</span>'+
      '<span class="musv" style="color:'+(behind?C.orange:'#8a7f6f')+'">'+fx(have,1).replace(/\.0$/,'')+
        '<b>/'+fx(tgt,1).replace(/\.0$/,'')+'</b></span></div>';
  }).join('');
  var late=MUSORD.filter(function(k){
    return mt[k]>0&&MUS[k].pri&&mex[k]>0&&mw[k]<mex[k]*0.85;});
  return '<div class="scard static dom dom-trn"><div class="shead"><div>'+
    '<div class="stitle">Haftalık Set Sayısı</div>'+
    '<div class="ssub">'+wp.done+'/'+wp.plan+' antrenman · çizgi = o kastan şu ana kadar beklenen</div></div></div>'+
    '<div class="muslist">'+rows+'</div>'+
    (late.length

function adherenceM(){
  var T=S.targets,ks=keys().filter(function(d){return d<=today();}).slice(-7);
  if(!ks.length)return '';
  function avg(k){var a=ks.map(function(d){return D(d)[k];}).filter(function(v){return v!=null;});
    return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  var gymPlan=0,gymDone=0;
  ks.forEach(function(d){var t=PROGRAM[dtOf(d)];
    if(t&&t.ex.length){gymPlan++;var e=sessionEval(d);if(e&&!e.empty&&e.tam/e.total>=.6)gymDone++;}});
  var rows=[
    {l:'Kalori',v:avg('kcal'),t:T.kcal,c:C.blue,u:'',inv:true},
    {l:'Protein',v:avg('p'),t:T.protein,c:C.green,u:'g'},
    {l:'Karbonhidrat',v:avg('c'),t:T.carbs,c:C.amber,u:'g'},
    {l:'Yağ',v:avg('f'),t:T.fat,c:C.violet,u:'g'},
    {l:'Adım',v:avg('st'),t:T.steps,c:C.orange,u:''},
    {l:'Uyku',v:avg('sl'),t:7.5,c:C.cyan,u:'sa',dec:1},
    {l:'Antrenman',v:gymDone,t:gymPlan||1,c:C.pink,u:'',raw:true},
    {l:'Kreatin',v:supRate('kreatin',7),t:7,c:C.violet,u:'',raw:true}
  ];
  var hit=0,tot=0;
  rows.forEach(function(r){if(r.v==null)return;tot++;
    var ok=r.inv?(r.v<=r.t*1.08):(r.v/r.t>=.95);if(ok)hit++;});
  return '<div class="scard static">'+
    '<div class="shead"><div><div class="stitle">Son 7 Gün Ortalaması</div>'+
      '<div class="ssub">'+ks.length+' gün kayıt'+(tot?' · '+hit+'/'+tot+' hedef tutmuş':'')+'</div></div></div>'+
    '<div class="advg">'+rows.map(function(r){
      var p=r.v==null?0:clamp(r.v/r.t*100);
      var col=r.v==null?'#dfd4bd':(r.inv?(r.v<=r.t*1.08?r.c:C.red):(p>=95?r.c:p>=75?C.amber:C.orange));
      var txt=r.v==null?'—':(r.raw?r.v+' / '+r.t
        :(r.dec?fx(r.v,r.dec):ti(r.v))+(r.u?' '+r.u:''));
      var sub=r.raw?'':('hedef '+(r.dec?fx(r.t,r.dec):ti(r.t))+(r.u?' '+r.u:''));
      return '<div class="advr"><div class="advt"><span>'+r.l+'</span>'+
        '<b style="color:'+col+'">'+txt+'</b></div>'+
        '<div class="mbar"><i style="width:'+p.toFixed(0)+'%;background:'+col+'"></i></div>'+
        (sub?'<div class="advs">'+sub+'</div>':'')+'</div>';}).join('')+'</div>'+
  '</div>';
}

/* kilo / bel için büyük grafik — hedef çizgisi ve tarih ekseniyle */
function measureLine(pts,col,goal,unit,tser){
  if(pts.length<2)return '<div class="sempty">En az 2 ölçüm gerekiyor</div>';
  var W=340,H=168,PL=38,PR=14,TP=20,BT=28;
  var vs=pts.map(function(p){return p.v;});
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  var gIn=goal!=null&&goal<hi+(hi-lo||1);
  if(gIn){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  var pad=Math.max((hi-lo)*0.22,0.4);lo-=pad;hi+=pad;
  var n=pts.length,st=(W-PL-PR)/(n-1);
  function X(i){return PL+i*st;}
  function Y(v){return TP+(1-(v-lo)/(hi-lo))*(H-TP-BT);}
  var id='ml'+Math.random().toString(36).slice(2,7);
  var line=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
  var g='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+col+'" stop-opacity=".26"/>'+
    '<stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>';
  [lo+(hi-lo)*0.15,(lo+hi)/2,hi-(hi-lo)*0.15].forEach(function(v){
    g+='<line x1="'+PL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(v).toFixed(1)+'" stroke="#ece1cd" stroke-width="1"/>'+
       '<text x="'+(PL-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="700" fill="#b3a488" font-family="Karla">'+v.toFixed(1)+'</text>';});
  if(gIn)
    g+='<line x1="'+PL+'" y1="'+Y(goal).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(goal).toFixed(1)+
       '" stroke="'+C.green+'" stroke-width="1.4" stroke-dasharray="5 4"/>'+
       '<text x="'+(W-PR)+'" y="'+(Y(goal)-5).toFixed(1)+'" text-anchor="end" font-size="9.5" font-weight="700" fill="'+C.green+'" font-family="Karla">HEDEF '+goal.toFixed(1)+'</text>';
  var hasT=tser&&tser.length>1;
  g+='<path d="'+line+' L'+X(n-1).toFixed(1)+','+(H-BT)+' L'+X(0).toFixed(1)+','+(H-BT)+' Z" fill="url(#'+id+')"/>'+
     '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="'+(hasT?1.3:2.6)+'" stroke-linejoin="round" stroke-linecap="round" opacity="'+(hasT?.4:1)+'"/>';
  if(hasT){
    var d0=pts[0].d,dN=pts[n-1].d,sp=Math.max(1,dayDiff(d0,dN));
    var tw=tser.filter(function(p){return p.d>=d0&&p.d<=dN;});
    if(tw.length>1){
      var tl=tw.map(function(p,i){return (i?'L':'M')+(PL+dayDiff(d0,p.d)/sp*(W-PL-PR)).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
      g+='<path d="'+tl+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    }
  }
  pts.forEach(function(p,i){
    var edge=(i===0||i===n-1);
    g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(edge?3.4:1.9)+'" fill="'+col+'" opacity="'+(hasT&&!edge?.45:1)+'" stroke="#fbf8f2" stroke-width="'+(edge?1.6:0)+'"/>';
    if(edge)
      g+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.v)-10).toFixed(1)+'" text-anchor="'+(i===0?'start':'end')+
         '" font-size="11" font-weight="700" fill="'+col+'" font-family="Karla">'+p.v.toFixed(1)+'</text>';});
  if(hasT)g+='<text x="'+(PL+4)+'" y="'+(TP-6)+'" font-size="9" font-weight="700" fill="#b3a488" font-family="Karla">kalın çizgi = trend</text>';
  g+='<text x="'+PL+'" y="'+(H-8)+'" font-size="10" font-weight="600" fill="#b3a488" font-family="Karla">'+fdate(pts[0].d)+'</text>'+
     '<text x="'+(W-PR)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" font-weight="600" fill="#b3a488" font-family="Karla">'+fdate(pts[n-1].d)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>'+
    '<div class="dlbl2">'+n+' ölçüm · '+unit+'</div>';
}
function bigLine(h){
  if(h.length<2)return '<div class="sempty">En az 2 seans gerekiyor</div>';
  var W=340,H=150,PL=34,PR=12,TP=16,BT=26;
  var vs=h.map(function(z){return z.e1;});
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  var pad=Math.max((hi-lo)*0.3,1);lo-=pad;hi+=pad;
  var n=h.length,st=(W-PL-PR)/(n-1);
  function X(i){return PL+i*st;}
  function Y(v){return TP+(1-(v-lo)/(hi-lo))*(H-TP-BT);}
  var line=h.map(function(z,i){return (i?'L':'M')+X(i).toFixed(1)+','+Y(z.e1).toFixed(1);}).join(' ');
  var g='<defs><linearGradient id="dg1" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+C.violet+'" stop-opacity=".26"/><stop offset="100%" stop-color="'+C.violet+'" stop-opacity="0"/></linearGradient></defs>';
  [lo+(hi-lo)*0.2,(lo+hi)/2,hi-(hi-lo)*0.2].forEach(function(v){
    g+='<line x1="'+PL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-PR)+'" y2="'+Y(v).toFixed(1)+'" stroke="#ece1cd" stroke-width="1"/>'+
       '<text x="'+(PL-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="10" font-weight="700" fill="#b3a488" font-family="Karla">'+v.toFixed(0)+'</text>';});
  g+='<path d="'+line+' L'+X(n-1).toFixed(1)+','+(H-BT)+' L'+X(0).toFixed(1)+','+(H-BT)+' Z" fill="url(#dg1)"/>'+
     '<path d="'+line+'" fill="none" stroke="'+C.violet+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  h.forEach(function(z,i){
    g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(z.e1).toFixed(1)+'" r="3.4" fill="'+C.violet+'" stroke="#fbf8f2" stroke-width="1.6"/>';
    if(i===n-1||i===0)
      g+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(z.e1)-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+C.violet+'" font-family="Karla">'+z.e1kg+'×'+z.e1rep+'</text>';});
  g+='<text x="'+PL+'" y="'+(H-7)+'" font-size="10" font-weight="600" fill="#b3a488" font-family="Karla">'+fdate(h[0].d)+'</text>'+
     '<text x="'+(W-PR)+'" y="'+(H-7)+'" text-anchor="end" font-size="10" font-weight="600" fill="#b3a488" font-family="Karla">'+fdate(h[n-1].d)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>'+
    '<div class="dlbl2">Tahmini 1RM (Epley) · kg × tekrar birlikte sayılır</div>';
}

function calendarM(){
  var wFrom=firstWeek(),tod=today(),wkNow=weekIdx(tod);
  var m0=addD(monday(S.startDate),(wFrom-1)*7),nW=S.weeks-wFrom+1;
  var WL=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
  var g='<div class="mcal"><div class="mcalhd"><span></span>'+
    WL.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div>';
  for(var w=0;w<nW;w++){
    var cells='',wn=wFrom+w,preW=wn<1,wdl=wn>0&&deloadEvery()>0&&wn%deloadEvery()===0;
    for(var i=0;i<7;i++){
      var d=addD(m0,w*7+i),future=d>tod;
      var dt=effDt(d),t=dt?PROGRAM[dt]:null,code=(t&&t.code)||'';
      var rest=(dt==='rest'),q=future?null:dayQuality(d);
      var bgc='',tx='#b5a68c';
      if(rest)tx='#8a7a5e';
      else if(future)tx=code?'#b0a189':'#b5a68c';
      else if(typeof q==='number'){bgc=qColor(q);tx=(q>=0.9?'#fbf8f2':(q>=0.7?'#2f5340':'#7a4a33'));}
      cells+='<div class="mc'+(future?' future':'')+(rest?' rest':'')+(d===tod?' today':'')+
        (d===cur?' sel':'')+(preW?' pre':'')+(dt==='trav'?' lwc':'')+'" data-a="cell" data-d="'+d+'" style="'+(bgc?'background:'+bgc+';':'')+'color:'+tx+'">'+
        code+'</div>';
    }
    g+='<div class="mcalrow'+(wkNow===wn?' now':'')+(preW?' pre':'')+(wdl?' dl':'')+'"><span class="mwk">'+wkLabel(wn)+(wdl?'<i>D</i>':'')+'</span>'+cells+'</div>';
  }
  return g+'</div>';
}

/* Hareket değiştirme çubuğu artık #g-body'nin DIŞINDA.
   İçerideyken sorun şuydu: #g-body'nin giriş animasyonu (tabIn) transform
   kullanıyor; transform'lu bir ata, içindeki position:fixed elemanı kendine
   sabitler. Yani çubuk her yeniden çizimde viewport'tan kopup gövdeye
   yapışıyor, sonra geri dönüyordu — gözle görülen aşağı-yukarı kayma buydu.
   Dışarıda, hiç yeniden yaratılmayan kendi kabında duruyor: gerçekten sabit. */
function gymNav(){
  if(gTab!=='w')return '';
  var dt=planOf(cur),t=PROGRAM[dt],r=D(cur);
  if(!t||!t.ex.length)return '';
  if(exIdx>=t.ex.length)exIdx=0;
  var dots='';
  for(var j=0;j<t.ex.length;j++){
    var ev2=evalEx((r.ex||{})[t.ex[j].n],tgtOn(t.ex[j],cur),prevSession(t.ex[j].n,cur));
    var cl=j===exIdx?'on':(ev2.state==='tam'?'ok':(ev2.state==='yakin'?'near':(ev2.state!=='bos'?'part':'')));
    dots+='<button class="gdot '+cl+'" data-a="goex" data-i="'+j+'" aria-label="'+(j+1)+'. hareket"></button>';
  }
  return '<div class="gnav">'+
    '<button class="garrow" data-a="exprev"'+(exIdx===0?' disabled':'')+'>‹</button>'+
    '<div class="gdots">'+dots+'</div>'+
    '<button class="garrow" data-a="exnext"'+(exIdx>=t.ex.length-1?' disabled':'')+'>›</button>'+
  '</div>';
}

function startHint(){
  if(!S.startDate)return 'tarih seçilmedi';
  var pdn=progDay(today()),wk=weekIdx(today());
  var last=addD(S.startDate,S.weeks*7-1);
  return flong(S.startDate)+' başlangıç · bugün <b>'+(pdn>0?pdn+'. gün':'başlamadı')+'</b>'+
    (pdn>0?' · hafta '+wkLabel(wk)+'/'+S.weeks+' · bitiş '+flong(last):'');
}

var REPOPTS=[['1','Sadece bugün'],['3','Son 3 gün'],['7','Son 7 gün'],['14','Son 14 gün'],['30','Son 30 gün'],
             ['week','Bu hafta'],['all','Tüm program'],['custom','Özel aralık']];
var repRange='7', repFrom=null, repTo=null;
function repBounds(){
  var to=today(),from;
  if(repRange==='all'){var ks0=keys();from=ks0.length?ks0[0]:to;if(ks0.length&&ks0[ks0.length-1]>to)to=ks0[ks0.length-1];}
  else if(repRange==='week'){from=monday(to);}
  else if(repRange==='custom'){from=repFrom||addD(to,-6);to=repTo||today();}
  else from=addD(to,-(parseInt(repRange,10)-1));
  if(from>to){var t2=from;from=to;to=t2;}
  return [from,to];
}
function repLabel(){var b=repBounds();return b[0]===b[1]?flong(b[0]):fdate(b[0])+' – '+fdate(b[1]);}
function report(){
  var b=repBounds();
  var ks=keys().filter(function(d){return d>=b[0]&&d<=b[1];});
  if(!ks.length)return 'Seçilen aralıkta kayıt yok ('+repLabel()+').';
  var T=S.targets,o='';
  o+='EMRE — TAKİP RAPORU · '+repLabel()+' ('+ks.length+' kayıtlı gün)\n';
  o+='Program: '+flong(S.startDate)+' başlangıç · '+S.weeks+' hafta · '+S.base.weight+' → '+S.goal.weight+' kg\n';
  o+='Hedefler: '+T.kcal+' kcal · '+T.protein+'P / '+T.carbs+'K / '+T.fat+'Y g · '+T.steps+' adım\n';
  o+='Bugün: '+flong(today())+' (Hafta '+weekIdx(today())+', '+progDay(today())+'. gün)';
  var dlR=nextDeload();
  if(dlR)o+=dlR.now?' · BU HAFTA DELOAD':' · sonraki deload: hafta '+dlR.wk;
  o+='\n';
  var tnR=trendNow(),slR=trendSlope();
  if(tnR!=null)o+='Trend kilo: '+fx(tnR,1)+' kg'+(slR!=null?' ('+(slR>0?'+':'')+fx(slR,2)+' kg/hafta)':'')+
    ' · hedefe '+fx(Math.max(0,tnR-S.goal.weight),1)+' kg\n';
  var aR=tdeeAdvice();
  if(aR)o+='Gerçek bakım: '+aR.t.tdee+' kcal (ölçülen, '+aR.t.logged+'/'+aR.t.days+' gün, güven '+aR.t.conf+
    ') · ortalama alım '+aR.t.avg+' · günlük açık '+Math.abs(aR.t.deficit)+
    ' · önerilen hedef '+aR.sug+'\n';
  var shR=lastOf('sh'),bR=lastOf('b');
  if(shR!=null&&bR)o+='Omuz/bel oranı: '+fx(shR/bR,2)+' (omuz '+fx(shR,1)+' cm, bel '+fx(bR,1)+' cm)';
  var armR=lastOf('arm');
  if(armR!=null)o+=(shR!=null&&bR?' · ':'Çevre: ')+'kol '+fx(armR,1)+' cm';
  if(shR!=null||armR!=null)o+='\n';
  var slpR=avgSleep(14);
  if(slpR!=null)o+='Uyku (14 gün ort.): '+fx(slpR,1)+' saat\n';
  o+='='.repeat(58)+'\n\n';
  var byW={};ks.forEach(function(d){var w=weekIdx(d);(byW[w]=byW[w]||[]).push(d);});
  Object.keys(byW).map(Number).sort(function(a,b){return a-b;}).forEach(function(w){
    var ds=byW[w].sort();
    function av(k){var a=ds.map(function(d){return D(d)[k];}).filter(function(v){return v!=null;});
      return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length*10)/10:null;}
    o+='## HAFTA '+w+' ('+fdate(ds[0])+' – '+fdate(ds[ds.length-1])+')\n';
    o+='Kilo ort: '+(av('w')||'—')+' kg | Bel ort: '+(av('b')||'—')+' cm\n';
    o+='Adım: '+(av('st')!=null?Math.round(av('st')):'—')+' | Kcal: '+(av('kcal')!=null?Math.round(av('kcal')):'—')+' | P/K/Y: '+(av('p')||'—')+'/'+(av('c')||'—')+'/'+(av('f')||'—')+' g\n';
    var gp=0,gd=0;ds.forEach(function(d){var t=PROGRAM[dtOf(d)];if(t&&t.ex.length){gp++;var e=sessionEval(d);if(e&&!e.empty&&e.tam/e.total>=.6)gd++;}});
    var rl=restOf(ds[0]).map(function(x){return GUN[x];}).join(', ');
    var krh=ds.filter(function(d){return tookSup(d,'kreatin');}).length;
    o+='Antrenman: '+gd+'/'+gp+' | Kreatin: '+krh+'/'+ds.length+' gün | Dinlenme: '+(rl||'yok');
    if(isDeload(ds[0]))o+=' | DELOAD HAFTASI';
    o+='\n';
    var mwR=musWeek(monday(ds[0])),mtR=musTargets();
    var musLine=MUSORD.filter(function(k){return mtR[k]>0&&mwR[k]>0;}).map(function(k){
      return MUS[k].s+' '+fx(mwR[k],1).replace(/\.0$/,'')+'/'+fx(mtR[k],1).replace(/\.0$/,'');}).join(' | ');
    if(musLine)o+='Kas seti (efektif): '+musLine+'\n';
    o+='\n';
    ds.forEach(function(d){
      var r=D(d),b=[];
      if(r.w!=null)b.push(r.w+'kg');if(r.b!=null)b.push('bel '+r.b+'cm');
      if(r.st!=null)b.push(r.st+' adım');if(r.kcal!=null)b.push(r.kcal+'kcal');
      if(r.p!=null||r.c!=null||r.f!=null)b.push((r.p||0)+'/'+(r.c||0)+'/'+(r.f||0)+' PKY');
      var sp=SUPS.filter(function(x){return r.sup&&r.sup[x[0]];}).map(function(x){return x[1];});
      if(sp.length)b.push('takviye: '+sp.join('+'));
      o+='- '+d+' '+GUN[pd(d).getDay()]+': '+(b.join(', ')||'boş')+'\n';
      var t=PROGRAM[dtOf(d)];
      if(t&&t.ex.length){
        var e=sessionEval(d);
        o+='  '+t.short+(e&&!e.empty?' — '+e.verdict+' ('+e.tam+'/'+e.total+
          (e.off?', +'+e.off+' plan dışı':'')+', hacim '+Math.round(e.vol)+' kg)':' — kayıt yok')+'\n';
        dayEx(d,dtOf(d)).forEach(function(x){
          var f=((r.ex||{})[x.n]||[]).filter(function(s){return s.kg!=null&&s.rep!=null;});
          if(!f.length)return;
          var ar=avgRir(f),be=sessE1(f);
          o+='    '+x.n+(x.off?' [PLAN DIŞI — programdan çıkarıldı]':'')+
            ' [hedef '+x.s+'×'+x.r[0]+'-'+x.r[1]+']: '+
            f.map(function(s){return s.kg+'×'+s.rep+(s.rir!=null?'@RIR'+RIRL(s.rir):'');}).join(', ');
          if(be)o+=' | 1RM~'+fx(be.v,1);
          if(ar!=null)o+=' | ort.RIR '+fx(ar,1);
          if(isPR(x.n,d))o+=' | REKOR';
          o+='\n';
        });
      }
      else if(t&&!t.ex.length)o+='  '+t.short+'\n';
      if(r.note)o+='  >> NOT: '+String(r.note).replace(/\s*\n\s*/g,' / ')+'\n';
    });
    o+='\n';
  });

  var ups=[],stalls=[],okg=[];
  Object.keys(EXTGT).forEach(function(nm){
    var pg=progression(nm);if(!pg)return;
    var tail=(pg.rir!=null?' [ort.RIR '+fx(pg.rir,1)+']':'');
    if(pg.type==='up')ups.push(nm+': '+pg.kg+' kg → '+pg.next+' kg'+tail);
    else if(pg.type==='ok')okg.push(nm+': '+pg.kg+' kg, RIR düşüyor — takılma değil'+tail);
    else stalls.push(nm+': '+pg.kg+' kg ('+pg.streak+' seanstır aynı)'+tail);
  });
  if(ups.length||stalls.length||okg.length){
    o+='## AĞIRLIK ARTIRMA DURUMU\n';
    if(ups.length)o+='Hazır:\n'+ups.map(function(x){return '- '+x+'\n';}).join('');
    if(okg.length)o+='İlerliyor (aynı kilo, azalan RIR):\n'+okg.map(function(x){return '- '+x+'\n';}).join('');
    if(stalls.length)o+='Takıldı:\n'+stalls.map(function(x){return '- '+x+'\n';}).join('');
    o+='\n';
  }
  var notes=ks.filter(function(d){return D(d).note;});
  if(notes.length){
    o+='## GÜNLÜK NOTLAR ('+notes.length+' gün)\n';
    notes.forEach(function(d){
      var r2=D(d),bits=[];
      if(r2.kcal!=null)bits.push(r2.kcal+' kcal');else bits.push('kalori girilmedi');
      if(r2.p!=null)bits.push(r2.p+'g P');
      var dt2=dtOf(d),t2=dt2?PROGRAM[dt2]:null;
      if(t2&&t2.ex.length){var e2=sessionEval(d);bits.push(t2.short+(e2&&!e2.empty?' yapıldı':' YAPILMADI'));}
      else if(t2)bits.push(t2.short);
      o+='- '+d+' '+GUN[pd(d).getDay()]+' ['+bits.join(', ')+']\n  '+
        String(r2.note).replace(/\s*\n\s*/g,'\n  ')+'\n';
    });
    o+='\n';
  }
  var gaps=ks.filter(function(d){return d<=today()&&D(d).kcal==null&&!D(d).note;});
  if(gaps.length)o+='## KALORİ GİRİLMEMİŞ VE NOT DA YOK ('+gaps.length+' gün)\n'+
    gaps.map(function(d){return d;}).join(', ')+'\n\n';
  var slI=sleepInsight();
  if(slI)o+='## UYKU ETKİSİ\n7 saat altı ('+slI.nLo+' seans) ort. kalite %'+Math.round(slI.lo*100)+
    ' | 7 saat üstü ('+slI.nHi+' seans) ort. kalite %'+Math.round(slI.hi*100)+'\n\n';
  /* Program değişiklikleri — tarih aralığı ne olursa olsun her raporda tam liste.
     Geçmiş veri bu değişikliklerin ışığında okunmalı. */
  if(CHANGES.length){
    o+='## PROGRAM DEĞİŞİKLİKLERİ (kalıcı kayıt)\n';
    CHANGES.slice().sort(function(a,b){return a.d>b.d?1:-1;}).forEach(function(c){
      o+='\n['+c.d+'] '+c.t+'\n';
      c.y.forEach(function(x){o+='  · '+x+'\n';});
    });
    o+='\n';
  }
  return o;
}

  if(!a){
    var t0=tdee();
    return card('Gerçek Bakım Kalorisi','veri bekleniyor',null,'dom dom-nut',
      '<div style="padding:22px 18px;color:#8a7f6f;font-size:13.5px;line-height:1.6">'+

    ['Haftalık değişim',(t.kgWeek>0?'+':'')+fx(t.kgWeek,2),'kg',col,'hedef 0.3–0.7 kayıp'],
    ['Önerilen hedef',ti(a.sug),'kcal','#8b5cf6',(a.delta>0?'+':'')+ti(a.delta)+' fark']

        '<div class="s">'+x[4]+'</div></div>';}).join('')+'</div>'+
    '<div style="padding:0 18px 16px"><div style="border-radius:11px;padding:12px 14px;font-size:13px;font-weight:700;line-height:1.55;background:'+
      hexa(col,.12)+';color:'+col+'">'+a.msg+'</div>'+
    (Math.abs(a.delta)>=60
      ?'<button class="ghostbtn" data-a="usetdee" data-v="'+a.sug+'" style="margin-top:10px">Kalori hedefini '+ti(a.sug)+' yap</button>'
      :'<div class="mhint" style="margin-top:8px">Mevcut hedefin '+ti(S.targets.kcal)+' kcal — uygun, değiştirmeye gerek yok.</div>')+
    '</div></div>';
}

    'trend kilona göre hesaplanmış kalori ve makro hedefleri çıkacak.</div></div>';
  var a2=d.a;
  var cells=[['Kalori',ti(a2.kcal),'kcal',d.kcal],['Protein',a2.protein,'g',d.protein],

        '<div class="v">'+x[1]+'<span style="font-size:14px;color:#a8987c"> '+x[2]+'</span></div>'+
        '<div class="s" style="color:'+dc+'">'+(x[3]>0?'+':'')+x[3]+' fark</div></div>';}).join('')+'</div>'+
    '<div style="padding:0 18px 16px">'+

/* ============ FOTOĞRAF ============
   Gist senkronuna dahil DEĞİL — base64 fotoğraf JSON'u şişirir ve senkronu bozar.
   Sadece bu cihazda, ayrı bir anahtarda durur. */
var PKEY='emre:form:photos';
/* Veri yapısı: _ph[tarih] = [{u:dataUrl, t:eklenmeZamanıMs}, ...]
   Poz ayrımı kaldırıldı — bir güne kaç fotoğraf istersen o kadar. */
var _ph={};
function photos(){return _ph;}
function migratePhotos(o){
  var out={};
  Object.keys(o||{}).forEach(function(d){
    var v=o[d];
    if(typeof v==='string')out[d]=[{u:v,t:null}];
    else if(Array.isArray(v))out[d]=v.map(function(x){
      return (typeof x==='string')?{u:x,t:null,id:null}
        :{u:x.u,t:x.t||null,id:x.id||null};}).filter(function(x){return x.u;});
  });
  return out;
}
/* Fotoğraflar localStorage'a SIĞMAZ: ~35 fotoğrafta 5MB sınırı dolar ve
   dolduğunda antrenman verisinin kaydı da yazamaz olur. Bu yüzden fotoğraflar
   IndexedDB'de (yüzlerce MB) durur; localStorage yalnızca acil yedek yoldur. */
var PHDB=(function(){
  var db=null;
  function open(){
    return new Promise(function(res,rej){
      if(db)return res(db);
      if(typeof indexedDB==='undefined')return rej(new Error('idb yok'));
      var rq=indexedDB.open('form-photos',1);
      rq.onupgradeneeded=function(){rq.result.createObjectStore('kv');};
      rq.onsuccess=function(){db=rq.result;res(db);};
      rq.onerror=function(){rej(rq.error||new Error('idb açılamadı'));};
    });
  }
  return {
    get:function(k){return open().then(function(d){
      return new Promise(function(res,rej){
        var g=d.transaction('kv','readonly').objectStore('kv').get(k);
        g.onsuccess=function(){res(g.result);};
        g.onerror=function(){rej(g.error);};
      });});},
    set:function(k,v){return open().then(function(d){
      return new Promise(function(res,rej){
        var t=d.transaction('kv','readwrite');
        t.objectStore('kv').put(v,k);
        t.oncomplete=function(){res();};
        t.onerror=function(){rej(t.error);};
      });});}
  };
})();
function loadPhotos(){
  return PHDB.get(PKEY).then(function(v){
    if(v){try{_ph=migratePhotos(JSON.parse(v));}catch(e){}return;}
    /* IDB boş — eski localStorage kaydı varsa oradan taşı ve orayı boşalt */
    return STORE.get(PKEY).then(function(r){
      try{_ph=migratePhotos(JSON.parse((r&&r.value)||'{}'));}catch(e){}
      if(photoCount())
        PHDB.set(PKEY,JSON.stringify(_ph)).then(function(){
          try{localStorage.removeItem(PKEY);}catch(e){}
        }).catch(function(){});
    }).catch(function(){});
  }).catch(function(){
    /* IDB hiç yoksa (çok eski tarayıcı) eski yol */
    return STORE.get(PKEY).then(function(r){
      try{_ph=migratePhotos(JSON.parse((r&&r.value)||'{}'));}catch(e){}
    }).catch(function(){});
  });
}
/* aynı id veya aynı görüntü iki kez varsa birini at */
function phDedupe(){
  var seenId={},seenU={},removed=0;
  Object.keys(_ph||{}).forEach(function(d){
    var keep=[];
    (_ph[d]||[]).forEach(function(x){
      if(!x||!x.u){removed++;return;}
      var uk=x.u.length+':'+x.u.slice(-64);
      if((x.id&&seenId[x.id])||seenU[uk]){removed++;return;}
      if(x.id)seenId[x.id]=1;
      seenU[uk]=1;keep.push(x);
    });
    if(keep.length)_ph[d]=keep;else delete _ph[d];
  });
  if(removed)savePhotos();
  return removed;
}

/* ---- SİLİNENLER (mezar taşı) ----

   eşitlemede geri iniyordu. Silinen her fotoğrafın kimliği VE içerik özeti
   burada tutulur. Bu liste hem yerelde (IndexedDB) hem gist'te durur, yani
   bir cihazda silinen fotoğraf diğer cihazlarda da silinir.
   Kural: bu listedeki bir fotoğraf asla indirilmez, asla yüklenmez ve

function phDelHasHashes(){

/* uzun kenarı 1000px'e indir, jpeg 0.7 — büyütünce net, depolamayı da şişirmez */
function shrinkImage(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var mx=1000,w=img.width,h=img.height;
      if(w>h&&w>mx){h=Math.round(h*mx/w);w=mx;}
      else if(h>=w&&h>mx){w=Math.round(w*mx/h);h=mx;}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var cx=cv.getContext('2d');
      cx.fillStyle='#fff';cx.fillRect(0,0,w,h);
      cx.drawImage(img,0,0,w,h);
      try{cb(cv.toDataURL('image/jpeg',0.7));}catch(e){cb(null);}
    };
    img.onerror=function(){cb(null);};
    img.src=fr.result;
  };
  fr.onerror=function(){cb(null);};
  fr.readAsDataURL(file);
}

/* ============ FOTOĞRAF YEDEĞİ ============
   İki ayrı yol var, ikisi de bağımsız çalışır:
   1) Dosya yedeği  — tek JSON, internet gerekmez, her zaman işe yarar.
   2) Özel GitHub deposu — otomatik, her fotoğraf ayrı dosya olarak yüklenir.
   Gist KULLANILMAZ: gizli gist "erişilmez" değil, linki bilen herkes açar.
   Özel repo ise kimlik doğrulaması ister — vücut fotoğrafı için doğru yer orası. */
function phHash(u){
  /* FNV-1a — hızlı, deterministik; aynı görüntü = aynı kimlik, her cihazda */
  var h=0x811c9dc5;
  for(var i=0;i<u.length;i++){h^=u.charCodeAt(i);h=(h*0x01000193)>>>0;}
  return ('0000000'+h.toString(36)).slice(-7)+u.length.toString(36);
}
function phEnsureIds(){
  var ch=false;
  Object.keys(_ph||{}).forEach(function(d){
    (_ph[d]||[]).forEach(function(x){
      var want=d+'__'+(x.t||0)+'__h'+phHash(x.u||'');
      if(x.id!==want){x.id=want;ch=true;}
    });
  });
  if(ch)savePhotos();
  return ch;
}
function phIdDate(id){
  var m=String(id||'').slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(m)?m:null;
}
function phIdTime(id){
  var p=String(id||'').split('__');
  return p.length>1?(+p[1]||null):null;
}
function phHasId(id){
  var found=false;
  Object.keys(_ph||{}).forEach(function(d){
    (_ph[d]||[]).forEach(function(x){if(x.id===id)found=true;});});
  return found;
}

function phImportFile(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var src=d&&d.photos?d.photos:d;
      if(!src||typeof src!=='object')throw 0;
      var add=0;
      Object.keys(src).forEach(function(dd){
        var arr=src[dd];if(!Array.isArray(arr))return;
        arr.forEach(function(x){
          var o=(typeof x==='string')?{u:x}:x;
          if(!o||!o.u)return;
          if(o.id&&phHasId(o.id))return;
          var dup=(_ph[dd]||[]).some(function(y){return y.u===o.u;});
          if(dup)return;
          _ph[dd]=_ph[dd]||[];
          _ph[dd].push({u:o.u,t:o.t||null,id:o.id||null});
          add++;
        });
      });
      phEnsureIds();savePhotos();
      toast(add?add+' fotoğraf geri yüklendi':'yeni fotoğraf yoktu');
      render();
    }catch(e){toast('fotoğraf yedeği okunamadı');}
  };
  fr.readAsText(file);
}

var phSyncing=false, phMsg='';
function repoOK(){return !!(S.sync.token&&S.sync.repo);}
function ghWait(ms){return new Promise(function(r){setTimeout(r,ms);});}
/* GitHub, aynı depoya arka arkaya yazınca 409 (Conflict) veriyor.
   Bu yüzden her yazma sırayla, aralıklı ve gerekirse tekrar denenerek yapılır. */
function ghRepo(path,opts,tryN){
  opts=opts||{};tryN=tryN||0;
  var url='https://api.github.com'+path;
  if((opts.method||'GET')==='GET')url+=(url.indexOf('?')<0?'?':'&')+'_='+Date.now();
  return fetch(url,{
    method:opts.method||'GET',
    cache:'no-store',
    headers:{'Authorization':'Bearer '+S.sync.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:opts.body?JSON.stringify(opts.body):undefined
  }).then(function(r){
    if(r.status===404)return {__missing:true};
    if(r.status===401)throw new Error('Anahtar geçersiz — yeni anahtar üret');
    if(r.status===403)
      return r.text().then(function(tx){
        if(/rate limit|secondary/i.test(tx)&&tryN<4)
          return ghWait(2000*(tryN+1)).then(function(){return ghRepo(path,opts,tryN+1);});
        throw new Error('Anahtarda "repo" yetkisi yok ya da istek sınırı doldu');
      });
    if((r.status===409||r.status===422||r.status>=500)&&tryN<4)
      return ghWait(700*Math.pow(2,tryN)).then(function(){return ghRepo(path,opts,tryN+1);});
    if(!r.ok)return r.text().then(function(tx){
      var msg='';try{msg=(JSON.parse(tx).message)||'';}catch(e){msg=tx.slice(0,90);}
      throw new Error('GitHub '+r.status+(msg?' — '+msg:''));
    });
    return r.json();
  });
}

function phRemoteList(){
  return ghRepo('/repos/'+S.sync.repo+'/contents/photos').then(function(list){

    if(!Array.isArray(list))throw new Error('depo okunamadı');
    return list.filter(function(f){return f&&/\.jpg$/i.test(f.name||'');});

function phSync(silent){
  if(phSyncing)return Promise.resolve();
  if(!repoOK()){if(!silent)toast('önce özel depoyu bağla');return Promise.resolve();}
  phEnsureIds();
  phSyncing=true;
  if(!silent)phSetMsg('fotoğraflar senkronize ediliyor…');
  var base='/repos/'+S.sync.repo+'/contents/photos';
  var remote={};
  return phRemoteList().then(function(list){
    list.forEach(function(f){remote[f.name.replace(/\.jpg$/i,'')]=f;});
  }).then(function(){
    /* yerelde olup uzakta olmayanları yükle */
    var ups=[];
    Object.keys(_ph||{}).forEach(function(d){
      (_ph[d]||[]).forEach(function(x){
        if(phIsDeleted(x.id,x.u))return;
        if(!remote[x.id])ups.push({d:d,x:x});});});
    var i=0,upFail=0;
    function up(){
      if(i>=ups.length)return Promise.resolve({n:ups.length-upFail,f:upFail});
      var o=ups[i++];
      phSetMsg('yükleniyor '+i+'/'+ups.length);
      var b64=String(o.x.u||'').split(',')[1]||'';
      return ghRepo(base+'/'+o.x.id+'.jpg',{method:'PUT',
        body:{message:'foto '+o.d,content:b64}})
        .catch(function(e){
          if(!/zaten|exists|422/i.test(e.message||''))upFail++;
        })
        .then(function(){return ghWait(400);}).then(up);
    }
    return up();
  }).then(function(upRes){
    var nUp=upRes.n;
    /* önce mezar taşındakileri buluttan sil — yoksa aşağıdaki indirme onları
       tekrar getirir ve fotoğraf "silinmiyor" gibi görünür */
    var dels=Object.keys(remote).filter(function(id){return phDelHasId(id);});
    var k=0,cleaned=0;
    function del(){
      if(k>=dels.length)return Promise.resolve();
      var id=dels[k++],f=remote[id];
      phSetMsg('buluttan siliniyor '+k+'/'+dels.length);
      return ghRepo(base+'/'+id+'.jpg',{method:'DELETE',
        body:{message:'foto sil',sha:f.sha}})
        .then(function(){cleaned++;}).catch(function(){})
        .then(function(){delete remote[id];return ghWait(250);}).then(del);
    }
    return del().then(function(){return {nUp:nUp,cleaned:cleaned};});
  }).then(function(st){
    /* uzakta olup yerelde olmayanları indir.
       İsim eşleşmese bile içerik özeti eşleşiyorsa o dosya bizde var demektir
       (eski sürümlerin rastgele adla yüklediği kopyalar böyle ayıklanır). */
    var myHashes={};
    Object.keys(_ph||{}).forEach(function(d){(_ph[d]||[]).forEach(function(x){
      myHashes['h'+phHash(x.u||'')]=1;});});
    var miss=Object.keys(remote).filter(function(id){
      if(phDelHasId(id))return false;
      if(phHasId(id))return false;
      var hp=id.split('__')[2]||'';
      if(hp.charAt(0)==='h'&&myHashes[hp])return false;
      return true;
    });
    var j=0,got=0;
    function dn(){
      if(j>=miss.length)return Promise.resolve();
      var id=miss[j++];
      phSetMsg('indiriliyor '+j+'/'+miss.length);
      return ghRepo(base+'/'+id+'.jpg').then(function(f){
        if(f&&f.content){
          var d=phIdDate(id)||today();
          _ph[d]=_ph[d]||[];
          _ph[d].push({u:'data:image/jpeg;base64,'+String(f.content).replace(/\s/g,''),
            t:phIdTime(id),id:id});
          got++;
        }
      }).catch(function(){}).then(function(){return ghWait(150);}).then(dn);
    }
    return dn().then(function(){return {up:st.nUp,down:got,cleaned:st.cleaned};});
  }).then(function(r){
    phSyncing=false;phSetMsg('');
    if(!r.err)S.sync.phLast=Date.now();
    phApplyDeletes();phDedupe();savePhotos();save();
    var upN=r.up||0;
    if(!silent)toast(upN+' yüklendi · '+r.down+' indirildi'+(r.cleaned?' · '+r.cleaned+' kopya buluttan silindi':'')+(r.err?' · bir kısmı bekliyor':''));
    if(r.err&&!silent)toast('eksikler sonraki eşitlemede tamamlanır ('+r.err.message+')');
    if(r.down&&!typing())render();
    else{var e2=document.getElementById('phsyncbadge');if(e2)e2.textContent=phSyncLabel();}
  }).catch(function(e){
    phSyncing=false;phSetMsg('');
    if(/sınır|rate/i.test(e.message||''))S.sync.phCool=Date.now();
    if(!silent)toast('fotoğraf senkron hatası: '+e.message);
  });
}

  return m<1?'az önce eşitlendi':(m<60?m+' dk önce':Math.round(m/60)+' sa önce');

function _phCleanCore(){

  Object.keys(_ph||{}).forEach(function(d){(_ph[d]||[]).forEach(function(x){
    myH['h'+phHash(x.u||'')]=1;});});
  phRemoteList().then(function(list){
    var junk=list.filter(function(f){
      var id=f.name.replace(/\.jpg$/i,'');
      if(mine[id])return false;              /* birebir bizde olan kalır */
      var hp=id.split('__')[2]||'';
      if(hp.charAt(0)==='h'&&myH[hp])return true;  /* içeriği bizde olan kopya silinir */
      return true;                            /* hiçbir karşılığı olmayan artık silinir */
    });
    var i=0,failed=0;
    function del(){
      if(i>=junk.length)return Promise.resolve({n:junk.length-failed,f:failed});
      var f=junk[i++];
      phSetMsg('siliniyor '+i+'/'+junk.length);
      return ghRepo(base+'/'+f.name,{method:'DELETE',
        body:{message:'artik foto sil',sha:f.sha}})
        .then(function(){delete _phSkip[f.name.replace(/\.jpg$/i,'')];})
        .catch(function(){failed++;})
        .then(function(){return ghWait(350);}).then(del);
    }
    return del();
  }).then(function(res){
    savePhSkip();
    var n=res.n;
    phSyncing=false;phSetMsg('');
    S.sync.phLast=Date.now();save();
    toast(n?n+' artık dosya silindi'+(res.f?' · '+res.f+' silinemedi':''):'bulutta artık dosya yok');
    render();setTimeout(migCheck,600);
  }).catch(function(e){
    phSyncing=false;phSetMsg('');
    toast('temizlik hatası: '+e.message);
  });
}

   kaydırmadan, ilk ekranda. */
var FILLF=[['w','Kilo'],['b','Bel'],['sl','Uyku'],
  ['st','Adım'],['kcal','Kalori'],['p','Protein'],['c','Karb'],['f','Yağ'],
  ['sup:kreatin','Kreatin']];
function fillState(d){
  var r=D(d),done=0,miss=[];
  FILLF.forEach(function(x){
    var k=x[0],ok;
    if(k.indexOf('sup:')===0)ok=!!(r.sup&&r.sup[k.slice(4)]);

    if(ok)done++; else miss.push(x[1]);
  });

}

    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="6" '+
      'stroke-linecap="round" stroke-dasharray="'+CC.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '+

   Burada ortalama tekrar ve "ağırlık mı tekrar mı" kararı duruyor. */
function prevSummary(prev,e){
  if(!prev)
    return '<div class="gprev"><span>İlk kez yapıyorsun — rahat bir ağırlıkla başla, '+
      e.r[0]+'-'+e.r[1]+' tekrar hedefle.</span></div>';
  var reps=prev.sets.map(function(s){return s.rep;});
  var avg=reps.reduce(function(a,b){return a+b;},0)/reps.length;
  var kgs=prev.sets.map(function(s){return s.kg;});
  var kgMax=Math.max.apply(null,kgs),kgMin=Math.min.apply(null,kgs);
  var rr=prev.sets.filter(function(s){return s.rir!=null;}).map(function(s){return s.rir;});
  var rAvg=rr.length?rr.reduce(function(a,b){return a+b;},0)/rr.length:null;
  var lo=e.r[0],hi=e.r[1],verdict,vc;
  if(avg>=hi){verdict='Üst sınırdaydın — bugün ağırlığı artır';vc=C.green;}
  else if(avg>=lo){verdict='Aralık içindeydin — aynı ağırlıkta tekrarı artır';vc=C.teal;}
  else{verdict='Alt sınırın altındaydın — ağırlığı koru, tekrarı topla';vc=C.amber;}
  return '<div class="gprevbox">'+
    '<div class="gprevhd"><span>GEÇEN SEANS · '+fdate(prev.date).toUpperCase()+'</span>'+
      '<button class="gcopy" data-a="samelast">Aynısını doldur</button></div>'+
    '<div class="gprevst">'+
      '<div><b>'+fx(avg,1)+'</b><i>ort. tekrar</i></div>'+
      '<div><b>'+(kgMin===kgMax?fx(kgMax,kgMax%1?1:0):fx(kgMin,0)+'–'+fx(kgMax,0))+'</b><i>kg</i></div>'+
      '<div><b>'+prev.sets.length+'</b><i>set</i></div>'+
      '<div><b>'+(rAvg==null?'—':fx(rAvg,1))+'</b><i>ort. RIR</i></div>'+
    '</div>'+
    '<div class="gprevv" style="color:'+vc+'">'+verdict+' <u>(hedef '+lo+'-'+hi+')</u>'+
      (function(){var pt=tgtFor(e.n,prev.date);
        return (pt&&(pt.r[0]!==lo||pt.r[1]!==hi))
          ?'<span style="color:#a8987c;font-weight:400"> · o gün hedef '+pt.r[0]+'-'+pt.r[1]+' idi</span>':'';})()+
    '</div>'+
  '</div>';
}

  if(res&&res.value){var p=JSON.parse(res.value);
    had=!!p.startDate;
    S.days=p.days||{};S.startDate=p.startDate||today();S.weeks=p.weeks||20;
    if(p.deloadEvery!=null)S.deloadEvery=p.deloadEvery;
    if(p.autoTargets!=null)S.autoTargets=!!p.autoTargets;
    if(p.targets)S.targets=Object.assign(S.targets,p.targets);
    if(p.base)S.base=Object.assign(S.base,p.base);
    if(p.goal)S.goal=Object.assign(S.goal,p.goal);
    if(Array.isArray(p.restDays))S.restDays=p.restDays;
    if(p.restWeeks&&typeof p.restWeeks==='object')S.restWeeks=p.restWeeks;
    if(p.plan&&typeof p.plan==='object')S.plan=p.plan;
    S._pt=p._pt||0;S._st=p._st||0;
    if(p.sync&&typeof p.sync==='object')S.sync=Object.assign(S.sync,p.sync);}
  /* Başlangıç tarihi SADECE hiç kayıt yoksa bugüne çekilir.
     Kayıtlı bir tarih varsa asla üzerine yazma. */
  if(!had)S.startDate=today();
  if(migrateNames())STORE.set(KEY,JSON.stringify(S));
}).catch(function(){S.startDate=today();}).then(function(){
  if(!S.startDate)S.startDate=today();
  cur=today();
  try{
    var pl=loadPhotos();
    if(pl&&pl.then)pl.then(function(){return loadPhSkip();}).then(function(){return loadPhDel();})
      .then(function(){try{phApplyDeletes();phDedupe();phEnsureIds();}catch(e){}});
    (pl&&pl.then?pl:Promise.resolve()).then(function(){
      return STORE.get(MODEKEY).then(function(r){forceMode=(r&&r.value&&r.value!=='auto')?r.value:null;})
        .catch(function(){});
    }).then(function(){render();}).catch(function(){render();})
      .then(function(){restoreRest();});
    /* kayıt 450ms gecikmeli yazılıyor; o aralıkta uygulama kapanırsa son giriş uçmasın */
    function flushSave(){
      try{clearTimeout(st);}catch(e){}
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      try{STORE.set(KEY,JSON.stringify(S));}catch(e){}
    }
    window.addEventListener('pagehide',flushSave);
    document.addEventListener('visibilitychange',function(){
      if(document.hidden)flushSave();else resumeRest();});
    window.addEventListener('pageshow',function(){resumeRest();});
    window.addEventListener('focus',function(){resumeRest();});
    if(S.sync.token&&S.sync.gist){
      syncNow(true);
      /* fotoğraflar ayrı depoda — açılışta ve sekmeye dönüşte onları da çek,
         yoksa telefonda çekilen fotoğraf webde hiç görünmez */
      if(repoOK())setTimeout(function(){
        if(Date.now()-(S.sync.phCool||0)>600000)phSync(true);},1500);
      document.addEventListener('visibilitychange',function(){
        if(document.hidden)return;
        resumeRest();
        if(S.sync.token&&S.sync.gist)syncNow(true);
        if(repoOK()&&Date.now()-(S.sync.phLast||0)>300000&&
           Date.now()-(S.sync.phCool||0)>600000)phSync(true);
      });
    }
  }
  catch(err){
    app.innerHTML='<div class="card"><div class="pad">'+
      '<div class="serif" style="font-size:19px;margin-bottom:8px">Sayfa açılamadı</div>'+
      '<div style="font-size:13.5px;color:#6b5f4d;line-height:1.6">Kayıtlı veri bozulmuş olabilir. '+
      '“Sıfırla” kayıtları siler ve boş bir sayfayla başlar.</div>'+
      '<div style="margin-top:12px;font-family:monospace;font-size:11.5px;color:#a8987c">'+esc(err&&err.message)+'</div>'+
      '<button class="ghostbtn dark" style="margin-top:14px" onclick="try{localStorage.removeItem(\''+KEY+'\')}catch(e){};location.reload()">Sıfırla</button>'+
      '</div></div>';
  }
});

})();
</script>
