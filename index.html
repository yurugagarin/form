    '<div style="text-align:center;margin-top:18px;font-size:12.5px;color:#a8987c">'+
      'Kiloyu her sabah aç karnına gir · haftalık ortalamaya bak, tek güne değil · kayıtlar otomatik saklanır'+
    '</div>';
}
/* boyama sonrası: sayfayı yeniden kurmadan ilgili bölümleri tazele */
function repaint(){
  if(phone()){render();return;}
  zi('z-cal',calendar());
  var dz=document.getElementById('z-day');if(dz){dz.innerHTML=dayCard();bindToday();}
  zi('z-week',weekTable());zi('z-kpi',kpi());zi('z-prg',progressCard());
  zi('z-ch',trendChart()+adherence());
}
/* input odağını bozmadan hesaplananları tazele */
function zi(id,html){var el=document.getElementById(id);if(el)el.innerHTML=html;}
function refresh(){
  if(phone()){gymRefresh();return;}
  document.getElementById('z-kpi').innerHTML=kpi();
  document.getElementById('z-ch').innerHTML=trendChart()+adherence();
  document.getElementById('z-prg').innerHTML=progressCard();
  document.getElementById('z-week').innerHTML=weekTable();
  document.getElementById('z-cal').innerHTML=calendar();
  var rep=document.getElementById('rep'); if(rep)rep.value=report();
}
function refreshDayMetrics(){
  var r=D(cur),T=S.targets;
  var map={st:[T.steps,C.orange,false,''],kcal:[T.kcal,C.blue,true,''],p:[T.protein,C.green,false,'g'],
           c:[T.carbs,C.amber,false,'g'],f:[T.fat,C.violet,false,'g']};
  Object.keys(map).forEach(function(k){
    var cfg=map[k],v=r[k],bar=document.querySelector('[data-bar="'+k+'"]'),h=document.querySelector('[data-hint="'+k+'"]');
    if(!bar||!h)return;
    var p=v==null?0:clamp(v/cfg[0]*100);
    var col=v==null?'#dfd4bd':(cfg[2]?(v<=cfg[0]*1.08?cfg[1]:C.red):(p>=100?cfg[1]:p>=75?C.amber:C.orange));
    bar.style.width=p.toFixed(0)+'%';bar.style.background=col;
    h.style.color=v==null?'#a8987c':col;
    h.textContent=v==null?'—':(cfg[2]?((v-cfg[0]>0?'+':'')+ti(v-cfg[0])+' kcal'):(v>=cfg[0]?'hedef tamam':ti(cfg[0]-v)+(cfg[3]?' '+cfg[3]:'')+' eksik'));
  });
  var mk=document.querySelector('[data-mk]');
  if(mk){var kc=(r.p||0)*4+(r.c||0)*4+(r.f||0)*9;mk.textContent=kc?ti(kc)+' kcal':'—';}
  var mbHolder=document.querySelectorAll('.metrics')[1];
  if(mbHolder){var cell=mbHolder.children[1];if(cell)cell.innerHTML='<label>Makro dağılımı</label>'+macroBar(r);}
}
function refreshEx(name){
  var t=PROGRAM[planOf(cur)];if(!t)return;
  var e=null;t.ex.forEach(function(x){if(x.n===name)e=x;});
  if(!e)return;
  var row=document.querySelector('[data-ex="'+cssq(name)+'"]');if(!row)return;
  var ev=evalEx((D(cur).ex||{})[name],e);
  var b=row.querySelector('[data-badge]');
  if(b){b.textContent=ev.label;b.style.color=ev.color;b.style.background=ev.bg;}
  var vo=row.querySelector('[data-vol]');if(vo)vo.innerHTML='hacim <b>'+ti(ev.vol)+'</b> kg';
  var p=prevSession(name,cur),tr=row.querySelector('[data-trend]');
  if(tr){
    if(p&&ev.vol>0){var d=(ev.vol-p.vol)/p.vol*100;
      tr.innerHTML='<span style="color:'+(d>1?C.green:d<-1?C.orange:'#a8987c')+'"><b>'+(d>0?'+':'')+d.toFixed(0)+'%</b> hacim</span>';}
    else tr.innerHTML='';}
  var se=document.querySelector('[data-sess]');if(se)se.innerHTML=sessionLine(cur,planOf(cur));
}
function cssq(s){return s.replace(/"/g,'\\"');}

function applySet(t){
  var sk=t.getAttribute('data-s');
  var box=t.closest('[data-i]'),row=t.closest('[data-ex]');
  if(!box||!row)return;
  var name=row.getAttribute('data-ex'),i=+box.getAttribute('data-i');
  var r=touch(cur);r.ex=r.ex||{};
  if(!r.dt)r.dt=planOf(cur);
  r.ex[name]=r.ex[name]||[];
  while(r.ex[name].length<=i)r.ex[name].push({kg:null,rep:null});
  r.ex[name][i][sk]=n(t.value);
  if(r.ex[name][i].kg==null||r.ex[name][i].rep==null)r.ex[name][i].d=false;
  if(t.tagName==='SELECT')t.className=t.className.replace(' ph','')+(t.value===''?' ph':'');
  var rowEl=t.closest('.gset');
  if(rowEl)rowEl.className='gset'+(r.ex[name][i].d?' done':'');
  var okEl=rowEl&&rowEl.querySelector('.ok');
  if(okEl)okEl.textContent=r.ex[name][i].d?'✓':'○';
  var clrEl=rowEl&&rowEl.querySelector('.clr');
  if(clrEl)clrEl.className='clr'+((r.ex[name][i].kg!=null||r.ex[name][i].rep!=null)?' live':'');
  save(cur);refreshEx(name);refresh();
}

/* ============ OLAYLAR ============ */
app.addEventListener('input',function(ev){
  var t=ev.target;
  /* gün alanları */
  var f=t.getAttribute('data-f');
  if(f){var r=touch(cur);
    if(!r.dt)r.dt=planOf(cur);
    if(f==='note')r.note=t.value;else r[f]=n(t.value);
    save(cur);
    if(f==='w'||f==='b'){refresh();}else{refreshDayMetrics();refresh();}
    return;}
  /* set kutuları */
  if(t.getAttribute('data-s')){applySet(t);return;}
  /* ayarlar */
  var g=t.getAttribute('data-g');
  if(g){
    var v=(g==='startDate')?t.value:n(t.value);
    if(g==='startDate'){if(!v)return;S.startDate=v;}
    else{if(v==null||v<=0)return;
      if(g.indexOf('.')>0){var a=g.split('.');S[a[0]][a[1]]=v;}else S[g]=Math.round(v);}
    S._st=Date.now();save();refresh();return;}
});
app.addEventListener('change',function(ev){
  if(ev.target.getAttribute&&ev.target.getAttribute('data-s')){applySet(ev.target);return;}
  var a=ev.target.getAttribute('data-a');
  if(a==='dt'){var v0=ev.target.value;touch(cur).dt=v0;S.plan=S.plan||{};S.plan[cur]=v0;S._pt=Date.now();save(cur);render();}
  if(a==='reprange'){repRange=ev.target.value;
    if(repRange==='custom'){if(!repTo)repTo=today();if(!repFrom)repFrom=addD(today(),-6);}
    document.getElementById('z-set').innerHTML=settings();}
  if(a==='repfrom'){repFrom=ev.target.value;document.getElementById('rep').value=report();}
  if(a==='repto'){repTo=ev.target.value;document.getElementById('rep').value=report();}
  if(a==='imp'){
    var file=ev.target.files&&ev.target.files[0];if(!file)return;
    var fr=new FileReader();
    fr.onload=function(){try{var d=JSON.parse(fr.result);
      if(!d||!d.days)throw 0;
      S.days=d.days;if(d.targets)S.targets=Object.assign(S.targets,d.targets);
      if(d.startDate)S.startDate=d.startDate;if(d.base)S.base=d.base;if(d.goal)S.goal=d.goal;if(d.weeks)S.weeks=d.weeks;if(Array.isArray(d.restDays))S.restDays=d.restDays;if(d.restWeeks)S.restWeeks=d.restWeeks;if(d.plan)S.plan=d.plan;
      save();render();toast('yedek yüklendi');}catch(e){toast('yedek okunamadı');}};
    fr.readAsText(file);ev.target.value='';}
});
app.addEventListener('click',function(ev){
  if(!actx)primeAudio();
  var t=ev.target;
  if(t&&t.closest){var wrp=t.closest('[data-a]');if(wrp)t=wrp;}
  var a=t.getAttribute&&t.getAttribute('data-a');if(!a)return;
  if(a==='prev'){cur=addD(cur,-1);render();}
  else if(a==='next'){cur=addD(cur,1);render();}
  else if(a==='fig'){openFig(t.getAttribute('data-n'));}
  else if(a==='connect'){
    var ti=document.querySelector('[data-a="tokinp"]');connectSync(ti?ti.value:'');}
  else if(a==='joinsync'){
    var ti2=document.querySelector('[data-a="tokinp"]'),gi=document.querySelector('[data-a="gistinp"]');
    S.sync.token=(ti2?ti2.value:'').trim();S.sync.gist=(gi?gi.value:'').trim();
    if(!S.sync.token||!S.sync.gist){toast('anahtar ve gist ID gerekli');}
    else{STORE.set(KEY,JSON.stringify(S));syncNow();}}
  else if(a==='syncnow'){syncNow();}
  else if(a==='gtab'){gTab=t.getAttribute('data-k');zi('g-body',gymBody());gymTabsRefresh();window.scrollTo(0,0);}
  else if(a==='gym'){setMode('gym');}
  else if(a==='desktop'){setMode('desk');}
  else if(a==='gdt'){var gk=t.getAttribute('data-k');touch(cur).dt=gk;S.plan=S.plan||{};S.plan[cur]=gk;S._pt=Date.now();exIdx=0;save(cur);render();}
  else if(a==='goex'){exIdx=+t.getAttribute('data-i');zi('g-body',gymBody());}
  else if(a==='exprev'){if(exIdx>0){exIdx--;zi('g-body',gymBody());window.scrollTo(0,0);}}
  else if(a==='exnext'){var tt=PROGRAM[planOf(cur)];if(tt&&exIdx<tt.ex.length-1){exIdx++;zi('g-body',gymBody());window.scrollTo(0,0);}}
  else if(a==='rest30'){
    if(timer.done){timer.done=false;timer.total=30;timer.endAt=Date.now()+30000;
      try{if(titleSaved){document.title=titleSaved;titleSaved='';}}catch(e){}
      holdAudio(true);wakeOn();timer.iv=setInterval(tickRest,250);}
    else{timer.endAt+=30000;timer.total+=30;}
    saveRest();paintRest();}
  else if(a==='restskip'){clearRest();paintRest();}
  else if(a==='samelast'){
    var tp=PROGRAM[planOf(cur)],ex=tp.ex[exIdx],pv=prevSession(ex.n,cur);
    if(pv){var rr2=touch(cur);if(!rr2.dt)rr2.dt=planOf(cur);rr2.ex=rr2.ex||{};
      rr2.ex[ex.n]=pv.sets.map(function(x){return {kg:x.kg,rep:x.rep};});
      save(cur);zi('g-body',gymBody());}}
  else if(a==='setclear'){
    var tpc=PROGRAM[planOf(cur)],exc=tpc.ex[exIdx],ixc=+t.getAttribute('data-i');
    var rc=D(cur);
    if(rc.ex&&rc.ex[exc.n]&&rc.ex[exc.n][ixc]){
      if(rc.ex[exc.n].length>exc.s&&ixc>=exc.s)rc.ex[exc.n].splice(ixc,1);
      else rc.ex[exc.n][ixc]={kg:null,rep:null};
      save(cur);zi('g-body',gymBody());
    }}
  else if(a==='setdone'){
    var tp2=PROGRAM[planOf(cur)],ex2=tp2.ex[exIdx],ix3=+t.getAttribute('data-i');
    var rr3=touch(cur);if(!rr3.dt)rr3.dt=planOf(cur);rr3.ex=rr3.ex||{};
    var arr=rr3.ex[ex2.n]=rr3.ex[ex2.n]||[];
    while(arr.length<=ix3)arr.push({kg:null,rep:null});
    if(arr[ix3].kg==null||arr[ix3].rep==null){
      var src=(ix3>0&&arr[ix3-1].kg!=null)?arr[ix3-1]:null;
      if(!src){var pv2=prevSession(ex2.n,cur);src=pv2&&pv2.sets[ix3]?pv2.sets[ix3]:null;}
      if(src){if(arr[ix3].kg==null)arr[ix3].kg=src.kg;if(arr[ix3].rep==null)arr[ix3].rep=src.rep;}
    }
    if(arr[ix3].kg==null||arr[ix3].rep==null){toast('önce kg ve tekrar gir');return;}
    arr[ix3].d=!arr[ix3].d;
    save(cur);zi('g-body',gymBody());
    if(arr[ix3].d)startRest(ex2.n);
  }
  else if(a==='linkcode'){
    var code=makeCode();
    if(!code){toast('kod üretilemedi');}
    else{try{navigator.clipboard.writeText(code);}catch(e){}
      t.textContent='Kopyalandı';setTimeout(function(){t.textContent='Bağlantı kodunu kopyala';},1600);}}
  else if(a==='usecode'){
    var ci=document.querySelector('[data-a="codeinp"]'),parsed=readCode(ci?ci.value:'');
    if(!parsed){toast('kod okunamadı — FORM1- ile başlamalı');}
    else{S.sync.token=parsed.token;S.sync.gist=parsed.gist;
      STORE.set(KEY,JSON.stringify(S));syncNow();}}
  else if(a==='syncoff'){
    S.sync={token:'',gist:'',auto:true,last:0};
    STORE.set(KEY,JSON.stringify(S));toast('bulut bağlantısı kesildi');render();}
  else if(a==='copygist'){
    try{navigator.clipboard.writeText(S.sync.gist);}catch(e){}
    t.textContent='Kopyalandı';setTimeout(function(){t.textContent='ID’yi kopyala';},1500);}
  else if(a==='sup'){
    var sk=t.getAttribute('data-k'),rr=touch(cur);
    if(!rr.dt)rr.dt=planOf(cur);
    rr.sup=rr.sup||{};rr.sup[sk]=!rr.sup[sk];
    if(!rr.sup[sk])delete rr.sup[sk];
    save(cur);repaint();}
  else if(a==='restd'){
    var rd=t.getAttribute('data-d');
    setPlan(rd,effDt(rd)==='rest'?'clear':'rest');repaint();}
  else if(a==='rest7'){
    var wd=+t.getAttribute('data-w'),ix=S.restDays.indexOf(wd);
    if(ix>=0)S.restDays.splice(ix,1);else S.restDays.push(wd);
    S._st=Date.now();save();render();}
  else if(a==='ptab'){pTab=t.getAttribute('data-k');document.getElementById('z-prog').innerHTML=programCard();}
  else if(a==='today'){cur=today();render();}
  else if(a==='cell'){
    var cd=t.getAttribute('data-d');
    if(paintMode){setPlan(cd,paintMode);repaint();}
    else{cur=cd;render();document.getElementById('z-day').scrollIntoView({behavior:'smooth',block:'start'});}}
  else if(a==='paint'){paintMode=t.getAttribute('data-k')||null;fillArm=false;
    document.getElementById('z-cal').innerHTML=calendar();}
  else if(a==='autofill'){
    if(!fillArm){fillArm=true;document.getElementById('z-cal').innerHTML=calendar();}
    else{fillArm=false;autoFill();render();}}
  else if(a==='wprev'){wkOffset--;document.getElementById('z-week').innerHTML=weekTable();}
  else if(a==='wnext'){if(wkOffset<0){wkOffset++;document.getElementById('z-week').innerHTML=weekTable();}}
  else if(a==='wnow'){wkOffset=0;document.getElementById('z-week').innerHTML=weekTable();}
  else if(a==='addset'){
    var row=t.closest('[data-ex]'),name=row.getAttribute('data-ex');
    var r=touch(cur);r.ex=r.ex||{};r.ex[name]=r.ex[name]||[];
    var e=null;PROGRAM[planOf(cur)].ex.forEach(function(x){if(x.n===name)e=x;});
    while(r.ex[name].length<Math.max(e.s,r.ex[name].length))r.ex[name].push({kg:null,rep:null});
    r.ex[name].push({kg:null,rep:null});save(cur);render();}
  else if(a==='delset'){
    var box=t.closest('[data-i]'),row2=t.closest('[data-ex]'),name2=row2.getAttribute('data-ex'),i=+box.getAttribute('data-i');
    var r3=touch(cur);if(r3.ex&&r3.ex[name2]){r3.ex[name2].splice(i,1);save(cur);render();}}
  else if(a==='usemacro'){
    var r4=touch(cur),kc=Math.round((r4.p||0)*4+(r4.c||0)*4+(r4.f||0)*9);
    if(kc){r4.kcal=kc;save(cur);render();}}
  else if(a==='scroll'){document.getElementById('z-set').scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='copy'){
    var ta=document.getElementById('rep');
    try{navigator.clipboard.writeText(ta.value);}catch(e){ta.removeAttribute('readonly');ta.select();document.execCommand('copy');ta.setAttribute('readonly','');}
    t.textContent='Kopyalandı';setTimeout(function(){t.textContent='Raporu kopyala';},1600);}
  else if(a==='dl'){
    var blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});
    var u=URL.createObjectURL(blob),el=document.createElement('a');
    el.href=u;el.download='form-yedek-'+today()+'.json';el.click();setTimeout(function(){URL.revokeObjectURL(u);},900);}
});

/* ============ AÇILIŞ ============ */
STORE.get(KEY).then(function(res){
  if(res&&res.value){var p=JSON.parse(res.value);
    S.days=p.days||{};S.startDate=p.startDate||today();S.weeks=p.weeks||20;
    if(p.targets)S.targets=Object.assign(S.targets,p.targets);
    if(p.base)S.base=Object.assign(S.base,p.base);
    if(p.goal)S.goal=Object.assign(S.goal,p.goal);
    if(Array.isArray(p.restDays))S.restDays=p.restDays;
    if(p.restWeeks&&typeof p.restWeeks==='object')S.restWeeks=p.restWeeks;
    if(p.plan&&typeof p.plan==='object')S.plan=p.plan;
    S._pt=p._pt||0;S._st=p._st||0;
    if(p.sync&&typeof p.sync==='object')S.sync=Object.assign(S.sync,p.sync);}
  else S.startDate=today();
}).catch(function(){S.startDate=today();}).then(function(){
  if(!S.startDate)S.startDate=today();
  cur=today();
  try{
    STORE.get(MODEKEY).then(function(r){forceMode=(r&&r.value&&r.value!=='auto')?r.value:null;render();})
      .catch(function(){render();})
      .then(function(){restoreRest();});
    document.addEventListener('visibilitychange',function(){if(!document.hidden)resumeRest();});
    window.addEventListener('pageshow',function(){resumeRest();});
    window.addEventListener('focus',function(){resumeRest();});
    if(S.sync.token&&S.sync.gist){
      syncNow(true);
      document.addEventListener('visibilitychange',function(){
        if(document.hidden)return;
        resumeRest();
        if(S.sync.token&&S.sync.gist)syncNow(true);
      });
    }
  }
  catch(err){
    app.innerHTML='<div class="card"><div class="pad">'+
      '<div class="serif" style="font-size:19px;margin-bottom:8px">Sayfa açılamadı</div>'+
      '<div style="font-size:13.5px;color:#6b5f4d;line-height:1.6">Kayıtlı veri bozulmuş olabilir. '+
      '“Sıfırla” kayıtları siler ve boş bir sayfayla başlar.</div>'+
      '<div style="margin-top:12px;font-family:monospace;font-size:11.5px;color:#a8987c">'+esc(err&&err.message)+'</div>'+
      '<button class="ghostbtn dark" style="margin-top:14px" onclick="try{localStorage.removeItem(\''+KEY+'\')}catch(e){};location.reload()">Sıfırla</button>'+
      '</div></div>';
  }
});

})();
